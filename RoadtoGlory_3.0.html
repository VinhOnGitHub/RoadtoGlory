          <select id="rtg-exp-out" style="border:1px solid #e5e7eb;border-radius:8px;padding:2px 6px;">
            ${tiers.map(o=>`<option value="${o.t}" ${o.t===outTok?'selected':''}>${o.label} ~ ${o.t}</option>`).join('')}
          </select>
          <span>•</span>
          <span>Chi phí ≈ <span class="k">$${estCost.toFixed(4)}</span></span>
        </div>
        ${st.last? `<div class="rtg-mini" style="margin-top:6px;">Thực tế lần gần nhất: input ${st.last.prompt_tokens||0} • output ${st.last.completion_tokens||0} • tổng ${st.last.total_tokens||0}</div>` : ''}
      `;
      box.querySelector('#rtg-exp-out').addEventListener('change', (e)=>{
        st.onOutChange(parseInt(e.target.value)||300);
      });

  }

  function mount(){
    if (document.getElementById('rtg-chat-dock-root')) return;
    const host = el('div', { id:'rtg-chat-dock-root' });
    document.body.appendChild(host);
    host.classList.remove('rtg-visible');

    const dock = el('div', { class:'rtg-chat-dock' });
    host.appendChild(dock);

    // Header
    const header = el('div', { class:'rtg-chat-header' });
    header.appendChild(el('span', { }, 'Trợ lý Tiếng Trung (AI)'));
    header.appendChild(el('span', { class:'rtg-chip' }, 'Gemini'));
    header.appendChild(el('div', { class:'rtg-spacer' }));
    const btnSettings = el('button', { class:'rtg-btn' }, '⚙️');
    const btnClear = el('button', { class:'rtg-btn' }, '🗑️');
    
    const btnHide = el('button', { class:'rtg-btn primary' }, 'Ẩn');
    header.appendChild(btnSettings); header.appendChild(btnClear); header.appendChild(btnHide);
    dock.appendChild(header);

    // Body
    const body = el('div', { class:'rtg-chat-body' });
    dock.appendChild(body);

    // Quickbar
    const textArea = el('textarea');
    let sending = false;
    let messages = [];
    try{ messages = JSON.parse(getLS(S.history, '[]')) || []; }catch(_){}
    let expectedOut = 300;
    let lastUsage = null;

    const quickbar = makeQuickbar((p)=>{ textArea.value = (textArea.value? textArea.value+' ' : '') + p; textArea.focus(); });
    body.appendChild(quickbar);

    function scrollToBottom(){ body.scrollTop = body.scrollHeight; }

    function renderMessages(){
      // Clear all except quickbar
      while (quickbar.nextSibling) body.removeChild(quickbar.nextSibling);
      if (!messages.length){
        body.appendChild(el('div', { class:'rtg-mini' }, 'Mẹo: bật “Dùng ngữ cảnh bài học” trong ⚙️ để giúp trả lời bám sát từ vựng bạn đang học.'));
      }
      messages.forEach(m=>{
        const row = el('div', { class:'rtg-msg '+(m.role==='user'?'you':'') });
        const bubble = el('div', { class:'rtg-bubble '+(m.role==='user'?'':'ai') });
        if (m.role!=='user'){
          const bar = el('div', { class:'rtg-mini', style:'display:flex;align-items:center;gap:8px;margin-bottom:4px;color:#6b7280;' },
            `<span>Trợ lý</span><span class="rtg-link" id="speak">Đọc tiếng Trung</span>`);
          bubble.appendChild(bar);
          bar.querySelector('#speak').addEventListener('click', ()=>{
            if (window.speakText) try{ window.speakText(m.content, null, 1.0, null, 'A'); }catch(_){}
          });
          const md = el('div', { class:'rtg-markdown' });
          md.innerHTML = renderSmart(m.content);
          bubble.appendChild(md);
        } else {
          const pre = el('div', { style:'white-space:pre-wrap;' });
          pre.textContent = m.content;
          bubble.appendChild(pre);
        }
        row.appendChild(bubble);
        body.appendChild(row);
      });
      if (sending){
        body.appendChild(el('div', { class:'rtg-mini' }, 'Đang suy nghĩ…'));
      }
      scrollToBottom();
    }

    // Input area + estimator
    const inputWrap = el('div', { class:'rtg-chat-input' });
    inputWrap.appendChild(textArea);
    const actionRow = el('div', { style:'margin-top:8px;display:flex;align-items:center;gap:8px;' });
    const btnSend = el('button', { class:'rtg-btn primary' }, 'Gửi');
    const modelLabel = el('span', { class:'rtg-mini' }, 'Model: '+ (getLS(S.model, DEFAULT_MODEL) || DEFAULT_MODEL));
    actionRow.appendChild(btnSend); actionRow.appendChild(modelLabel);
    inputWrap.appendChild(actionRow);

    // Estimator removed per user's request
    const estimator = null;

    dock.appendChild(inputWrap);

    // Actions
    function saveHistory(){ setLS(S.history, JSON.stringify(messages)); }
    function getMessagesForSend(userText){
      const sys = getLS(S.sys, DEFAULT_SYS);
      const useCtx = getLSBool(S.useCtx, true);
      const ctx = useCtx ? getLessonContext(60) : '';
      const base = (getLS(S.baseUrl, DEFAULT_BASE) || DEFAULT_BASE);
      return [
        { role:'system', content: sys + (ctx? `\\n\\n${ctx}`:'') },
        ...messages,
        { role:'user', content: userText }
      ];
    }

    async function send(){
      const content = (textArea.value||'').trim();
      if (!content || sending) return;
      messages.push({ role:'user', content });
      textArea.value=''; sending = true; renderMessages(); saveHistory();
      try{
        const res = await geminiCall(getMessagesForSend(content));
        messages.push({ role:'assistant', content: res.text || '(trống)' });
        lastUsage = res.usage || null;
      }catch(err){
        messages.push({ role:'assistant', content: `⚠️ Lỗi: ${err.message}` });
      }finally{
        sending = false; renderMessages(); saveHistory(); // estimator removed
      }
    }

    
btnSend.addEventListener('click', send);

  font-weight:700;cursor:pointer;user-select:none}

  .card-3d { perspective: 1200px; position: relative; }

  .card-3d .back { transform: rotateY(180deg); }
</style>
<script>
(function(){
  if (window.__rtgHanziiInit) return; window.__rtgHanziiInit = true;
  const POP_ID='rtg-hz-pop', PANEL_ID='rtg-hz-panel', PILL_ID='rtg-hz-pill', MAX_LEN=30;
  let lastPt={x:0,y:0}, lastText="";
  const dbg = (msg, ...a)=>{ if (window.rtg_hz_debug!==false) console.log('[Hanzii]', msg, ...a); };
  const isEditable = el => !!el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'); // cho phép contentEditable

  function ensurePop(){
    let el=document.getElementById(POP_ID);
    if(!el){
      el=document.createElement('div'); el.id=POP_ID;
      el.innerHTML='<div class=\"hz-row\"><span class=\"hz-word\" id=\"rtg-hz-word\"></span>\
        <button class=\"hz-btn sec\" id=\"rtg-hz-inline\">Xem tại chỗ</button>\
        <button class=\"hz-btn\" id=\"rtg-hz-open\">Mở tab</button>\
        <span class=\"hz-close\" id=\"rtg-hz-x\">✕</span></div>';
      document.body.appendChild(el);
      document.getElementById('rtg-hz-x').onclick = hidePop;
      document.getElementById('rtg-hz-open').onclick = () => { openTab(el.dataset.word||''); hidePop(); };
      document.getElementById('rtg-hz-inline').onclick = () => { openInline(el.dataset.word||''); hidePop(); };
    }
    return el;
  }
  function ensurePanel(){
    let p=document.getElementById(PANEL_ID);
    if(!p){
      p=document.createElement('div'); p.id=PANEL_ID; p.style.display='none';
      p.innerHTML='<div class=\"hz-head\"><span class=\"hz-title\" id=\"rtg-hz-title\"></span>\
        <div class=\"hz-actions\">\
          <button id=\"rtg-hz-popout\">Mở tab</button>\
          <button id=\"rtg-hz-close\">Đóng</button>\
        </div></div>\
        <iframe id=\"rtg-hz-iframe\" sandbox=\"allow-scripts allow-forms allow-same-origin\"></iframe>';
      document.body.appendChild(p);
      document.getElementById('rtg-hz-close').onclick = ()=> p.style.display='none';
      document.getElementById('rtg-hz-popout').onclick = ()=> { const w=p.dataset.word||''; if(w) openTab(w); };
    }
    return p;
  }
  function ensurePill(){
    let el=document.getElementById(PILL_ID);
    if(!el){
      el=document.createElement('div'); el.id=PILL_ID; el.textContent='Tra Hanzii (Enter)';
      el.onclick=()=>{ const w=el.dataset.word||''; if(w) openInline(w); hidePill(); };
      document.body.appendChild(el);
    }
    return el;
  }

  function openTab(word){
    if(!word) return;
    const lang=(localStorage.getItem('rtg_lang')||'vi');
    const url='https://hanzii.net/search/word/'+encodeURIComponent(word)+'?hl='+encodeURIComponent(lang);
    window.open(url,'_blank','noopener');
  }
  function openInline(word){
    if(!word) return;
    const lang=(localStorage.getItem('rtg_lang')||'vi');
    const url='https://hanzii.net/search/word/'+encodeURIComponent(word)+'?hl='+encodeURIComponent(lang);
    const p=ensurePanel(); p.dataset.word=word;
    document.getElementById('rtg-hz-title').textContent=word;
    const f=document.getElementById('rtg-hz-iframe');
    try{ f.src=url; }catch(e){ console.warn('iframe set src failed', e); }
    p.style.display='flex';
  }

  function isZhLike(t){ return /[\u3400-\u4dbf\u4e00-\u9fff]/.test(t); }
  function norm(s){ return (s||'').replace(/[\s\u200b-\u200d]+/g,'').trim(); }
  function place(el,rect){
    const pad=8; let left=Math.min(rect.left,window.innerWidth-el.offsetWidth-pad);
    let top=(rect.top>48?rect.top-el.offsetHeight-10:rect.bottom+10);
    if(left<pad) left=pad; if(top<pad) top=rect.bottom+10; el.style.left=left+'px'; el.style.top=top+'px';
  }
  function showFor(word,rect){
    const el=ensurePop(); el.dataset.word=word;
    document.getElementById('rtg-hz-word').textContent=word;
    el.style.display='block'; requestAnimationFrame(()=>place(el,rect));
    const pill=ensurePill(); pill.style.display='none';
    dbg('show popup', word, rect);
  }
  function hidePop(){ const el=document.getElementById(POP_ID); if(el) el.style.display='none'; }
  function showPill(word){ const el=ensurePill(); el.dataset.word=word; el.style.display='block'; }
  function hidePill(){ const el=document.getElementById(PILL_ID); if(el) el.style.display='none'; }

  function rectFromSelection(){
    const sel=window.getSelection(); if(!sel||sel.rangeCount===0) return {left:lastPt.x,top:lastPt.y,bottom:lastPt.y};
    const range=sel.getRangeAt(0).cloneRange(); let rect=null;
    try{ const r0=range.getClientRects(); rect=(r0&&r0.length)?r0[0]:range.getBoundingClientRect(); }catch(_){ rect=null; }
    if(!rect||(!rect.width&&!rect.height)){ range.collapse(false); const mk=document.createElement('span'); mk.style.cssText='position:fixed;left:-9999px;top:-9999px;width:0;height:0;'; range.insertNode(mk); rect=mk.getBoundingClientRect(); mk.remove(); }
    return rect||{left:lastPt.x,top:lastPt.y,bottom:lastPt.y};
  }
  function handleSelection(){
    try{
      const sel=window.getSelection(); if(!sel||sel.isCollapsed){ hidePop(); hidePill(); lastText=''; return; }
      const text=norm(sel.toString()); if(!text||text.length>MAX_LEN||!isZhLike(text)){ hidePop(); hidePill(); lastText=''; return; }
      const anchor=sel.anchorNode&&sel.anchorNode.parentElement; if(isEditable(anchor)){ hidePop(); hidePill(); lastText=''; return; }
      const rect=rectFromSelection();
      // If context menu likely open (no rect width/height), use pill
      if(!rect || (!rect.width && !rect.height)){ showPill(text); lastText=text; return; }
      showFor(text,rect); lastText=text;
    }catch(e){ dbg('handleSelection error', e); }
  }

  // Event triggers
  const delayed=()=>setTimeout(handleSelection,0);
  document.addEventListener('mousedown', e=>{ lastPt.x=e.clientX; lastPt.y=e.clientY; }, true);
  document.addEventListener('mouseup', delayed, true);
  document.addEventListener('dblclick', delayed, true);
  document.addEventListener('selectionchange', delayed);
  document.addEventListener('keyup', (e)=>{
    if (['Shift','Control','Alt','Meta','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
    delayed();
  }, true);
  document.addEventListener('contextmenu', delayed, true);

  // Polling fallback (covers cases selectionchange not firing in some browsers/file://)
  setInterval(()=>{
    try{
      const t = norm((window.getSelection()||{}).toString()||'');
      if (t!==lastText && t && isZhLike(t) && t.length<=MAX_LEN){
        lastText = t;
        const rect = rectFromSelection();
        if(!rect || (!rect.width && !rect.height)){ showPill(t); } else { showFor(t, rect); }
      }
      if (!t){ hidePop(); hidePill(); lastText=''; }
    }catch(_){}
  }, 250);

  // New default hotkey: Ctrl+Alt+H (có thể đổi bằng localStorage.rtg_hz_hotkey)
  function matchHotkey(e, spec){
    const s=(spec||'Ctrl+Alt+H'); const needCtrl=/Ctrl/i.test(s), needAlt=/Alt/i.test(s), needShift=/Shift/i.test(s);
    const key=s.split('+').pop().toLowerCase();
    return (!!e.ctrlKey===needCtrl) && (!!e.altKey===needAlt) && (!!e.shiftKey===needShift) && (e.key.toLowerCase()===key);
  }
  document.addEventListener('keydown', (e)=>{
    const spec = localStorage.getItem('rtg_hz_hotkey') || 'Ctrl+Alt+H';
    if (matchHotkey(e, spec)){
      const sel=window.getSelection(); const text=norm(sel?sel.toString():'');
      if(text&&isZhLike(text)){ e.preventDefault(); openInline(text); }
    }
  }, true);

  // Enter to confirm pill
  document.addEventListener('keydown', (e)=>{
    const pill=document.getElementById(PILL_ID);
    if (pill && pill.style.display==='block' && e.key==='Enter'){
      const w=pill.dataset.word||''; if(w){ e.preventDefault(); openInline(w); hidePill(); }
    }
  }, true);

  dbg('Hanzii v4.3 ready — hotkey Ctrl+Alt+H (customize with localStorage.rtg_hz_hotkey)');
})();
</script>


<!-- RTG: Robust keyword highlighter for 6 examples -->
<style id="rtg-example-keyword-style">
  .rtg-keyword{ color:#dc2626 !important; font-weight:800 !important; }

  .card-3d { perspective: 1200px; position: relative; }
  .card-3d .inner { transform-style: preserve-3d; transition: transform 600ms; height: 100%; }
  .card-3d .inner.flipped { transform: rotateY(180deg); }
  .card-3d .front, .card-3d .back { backface-visibility: hidden; position: absolute; inset: 0; width: 100%; height: 100%; }
  .card-3d .back { transform: rotateY(180deg); }
</style>
<script>
(function(){
  const HAS_ZH = /[\u3400-\u9FFF]/;
  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  function findHeadwordFromCard(card){
    // Try common selectors inside a vocab card
    const prefer = [
      '.rtg-vocab-title .rtg-hanzi',
      '.rtg-vocab-title', '.text-2xl.font-bold', '.text-xl.font-bold',
      '.font-bold.text-lg', '.rtg-hanzi', '[data-hanzi]'
    ];
    for (const sel of prefer){
      const el = card.querySelector(sel);
      if (!el) continue;
      const t = (el.getAttribute && el.getAttribute('data-hanzi')) || el.textContent || '';
      const m = (t.match(/[\u3400-\u9FFF]{1,6}/g)||[]).sort((a,b)=> (b.length-a.length));
      if (m[0]) return m[0];
    }
    // fallback: most frequent short word in card header
    const head = (card.querySelector('h1,h2,h3,h4')||{}).textContent || '';
    const arr = (head.match(/[\u3400-\u9FFF]{1,4}/g)||[]);
    const freq = new Map(); arr.forEach(s=>freq.set(s,(freq.get(s)||0)+1));
    return (Array.from(freq.entries()).sort((a,b)=>b[1]-a[1])[0]||[])[0]||'';
  }

  function highlightExamples(card){
    const kw = findHeadwordFromCard(card);
    if (!kw) return;
    const re = new RegExp(esc(kw), 'g');
    // Find sections labeled "Ví dụ:" inside this card
    card.querySelectorAll('p,div').forEach(p=>{
      const t = (p.textContent||'').trim().toLowerCase();
      if (!/^ví dụ[:：]?$/.test(t)) return;
      // The list is usually the next sibling <ul>
      let ul = p.nextElementSibling;
      if (!ul || ul.tagName!=='UL') return;
      ul.querySelectorAll('li').forEach(li=>{
        // Avoid re-run
        if (li.dataset.rtgKwApplied===kw) return;
        li.dataset.rtgKwApplied = kw;

        // Strategy: split on first " - " (space hyphen space) or '—' to separate ZH vs VI
        let html = li.innerHTML;
        let idx = html.indexOf(' - ');
        if (idx === -1) idx = html.indexOf(' — ');
        if (idx === -1) {
          // No explicit hyphen; replace only inside text nodes that contain CJK
          const walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT, null);
          const tnodes = [];
          while (walker.nextNode()) tnodes.push(walker.currentNode);
          tnodes.forEach(n=>{
            if (HAS_ZH.test(n.nodeValue||'')){
              n.nodeValue = (n.nodeValue||'').replace(re, m=> m? ('\u0000'+m+'\u0001') : m);
            }
          });
          li.innerHTML = li.innerHTML.replace(/\u0000/g,'<span class="rtg-keyword">').replace(/\u0001/g,'</span>');
        } else {
          const left = html.slice(0, idx);
          const right = html.slice(idx);
          const replaced = left.replace(re, m=> `<span class="rtg-keyword">${m}</span>`);
          li.innerHTML = replaced + right;
        }
      });
    });
  }

  function scanAll(){
    // Each vocab card wrapper (outer rounded box)
    document.querySelectorAll('.rounded-xl, .rounded-2xl, .rounded-lg').forEach(card=>{
      if (!card.querySelector('ul')) return; // ignore non-detail cards
      highlightExamples(card);
    });
  }

  const mo = new MutationObserver(()=> scanAll());
  mo.observe(document.body, {childList:true, subtree:true});
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', scanAll);
  else scanAll();
})();
</script>

<script>
(function(){
  const LS_LESSONS='chineseVocabLessons';
  const LS_COURSES='chineseVocabCourses';
  const LS_CUR='rtg_currentLessonId';

  // Gắn mục vào menu "Sao lưu & Nhập"
  function ensureMenuItem(){
    document.querySelectorAll('.dropdown-menu').forEach(box=>{
      if (box.dataset.rtgExcelBind==='1') return;
      const t=(box.textContent||'').toLowerCase();
      if (t.includes('sao lưu') && t.includes('nhập')){
        box.dataset.rtgExcelBind='1';
        const w=document.createElement('div');
        w.className='glass p-3 rounded-xl mb-2';
        w.innerHTML='<div class="text-sm font-semibold text-gray-700 mb-2">Nhập từ Excel/CSV</div><button class="rtg-mini-btn">Chọn file & Xem trước</button>';
        box.insertBefore(w, box.firstChild);
        w.querySelector('button').onclick=()=>{ document.getElementById('rtg-excel-modal').style.display='flex'; fillPickers(); };
      }
    });
  }
  new MutationObserver(ensureMenuItem).observe(document.body,{childList:true,subtree:true});
  ensureMenuItem();

  // DOM refs
  const modal=document.getElementById('rtg-excel-modal');
  const body =document.getElementById('rtg-excel-preview');
  const input=document.getElementById('rtg-excel-file');
  const nameInput=document.getElementById('rtg-excel-lesson-name');
  const courseSel=document.getElementById('rtg-excel-course');
  const lessonSel=document.getElementById('rtg-excel-lesson');
  const closeBtn=document.getElementById('rtg-excel-close');
  const importBtn=document.getElementById('rtg-excel-import');
  const newWrap=document.getElementById('rtg-new-wrap');
  const appendWrap=document.getElementById('rtg-append-wrap');
  let parsed=[];
  window.rtgExcelPassageMode=false; window.__rtgParsedPassage=[];

  function fillPickers(){
    let courses=[], lessons=[];
    try{ courses=JSON.parse(localStorage.getItem(LS_COURSES)||'[]'); }catch(_){}
    try{ lessons=JSON.parse(localStorage.getItem(LS_LESSONS)||'[]'); }catch(_){}
    courseSel.innerHTML='';
    if (courses.length){
      courses.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.name||'Khoá không tên'; courseSel.appendChild(o); });
    } else {
      const o=document.createElement('option'); o.value='__none'; o.textContent='(Chưa có khoá — sẽ dùng Khoá học mặc định)'; courseSel.appendChild(o);
    }
    lessonSel.innerHTML='';
    lessons.forEach(ls=>{
      const c=courses.find(cc=>String(cc.id)===String(ls.courseId));
      const o=document.createElement('option');
      o.value=ls.id; o.textContent=(ls.name||'Bài không tên')+(c?` — (Khoá: ${c.name||''})`:''); lessonSel.appendChild(o);
    });
  }

  // Chuyển chế độ
  document.querySelectorAll('input[name="rtg-mode"]').forEach(r=>{
    r.onchange=()=>{
      const m=document.querySelector('input[name="rtg-mode"]:checked').value;
      newWrap.classList.toggle('hide', m!=='new');
      appendWrap.classList.toggle('hide', m!=='append');
    };
  });

  // Parser helpers
  function lowerKeys(obj){ const o={}; Object.keys(obj).forEach(k=>o[k.toLowerCase()]=obj[k]); return o; }
  function G(k, keys){ for(const x of keys){ if(k[x]!==undefined) return k[x]; } return ''; }

  // Đọc file
  input.addEventListener('change', (e)=>{
    const f=e.target.files && e.target.files[0];
    if (!f){ return; }
    if (typeof XLSX === 'undefined'){ body.textContent='Lỗi đọc file: XLSX is not defined'; return; }
    const reader=new FileReader();
    reader.onload=(evt)=>{
      try{
        const wb = XLSX.read(evt.target.result, {type:'binary'});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:false});
        
        
        
        if (window.rtgExcelPassageMode){
          const NK = s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9]/g,'');
          const pass = rows.map(r=>{
            const km={}; Object.keys(r).forEach(h=> km[NK(h)] = r[h]);
            const H=(...keys)=>{ for(const x of keys){ if(km[x]!==undefined) return km[x]; } return ''; };
            const zh = H('hantu','chinese','hanzi','zi','cau','cauzh');
            const py = H('pinyin','pin_yin');
            const vi = H('nghiatiengviet','vietnamese','meaning','dich','dichviet');
            return { chinese:String(zh||'').trim(), pinyin:String(py||'').trim(), vietnamese:String(vi||'').trim(), speaker:'' };
          }).filter(s=> s.chinese||s.pinyin||s.vietnamese);
          window.__rtgParsedPassage = pass;
          var rowsHtmlPV = pass.slice(0,10).map(function(s){
            return '<tr><td>'+(s.chinese||'')+'</td><td>'+(s.pinyin||'')+'</td><td>'+(s.vietnamese||'')+'</td></tr>';
          }).join('');

<!-- RTG Voice Modal Hook v3 (A is main voice for examples/review; ABCDEF map for passage roles) -->
<script>
(function(){
  // Persist map as: { A:{index:number, name:string}, ... }
  function getMandarinVoices(){
    const list=(window.speechSynthesis && speechSynthesis.getVoices && speechSynthesis.getVoices())||[];
    return list.filter(v=>{
      const lang=(v.lang||'').toLowerCase();
      const name=(v.name||'').toLowerCase();
      if(!lang.startsWith('zh')) return false;
      if(lang.includes('hk')||name.includes('cantonese')||name.includes('yue')) return false;
      return lang.includes('zh-cn')||lang.includes('zh-hans')||lang.startsWith('zh');
    });
  }
  function loadMap(){
    try{
      const v2 = JSON.parse(localStorage.getItem('rtgCharacterVoiceMapV2')||'{}')||{};
      if(Object.keys(v2).length) return v2;
      // migrate from old numeric-only map if present
      const v1 = JSON.parse(localStorage.getItem('rtgCharacterVoiceMap')||'{}')||{};
      const vs = getMandarinVoices();
      const out={};
      Object.keys(v1).forEach(k=>{
        const idx = Number(v1[k]||0);
        out[k] = { index: idx, name: vs[idx] ? vs[idx].name : '' };
      });
      return out;
    }catch(_){ return {}; }
  }
  function saveMap(m){ try{ localStorage.setItem('rtgCharacterVoiceMapV2', JSON.stringify(m||{})); }catch(_){} }

  // Expose helpers for Console
  window.rtgSetCharacterVoiceIndex = function(char, index){
    const c=String(char||'').toUpperCase(); const idx=Number(index||0);
    const vs = getMandarinVoices(); const m = loadMap();
    m[c] = { index: idx, name: vs[idx] ? vs[idx].name : '' };
    saveMap(m); console.log('[RTG] Saved', c, m[c]);
  };
  window.rtgSetCharacterVoiceByName = function(char, name){
    const c=String(char||'').toUpperCase(); const vs=getMandarinVoices();
    const idx = Math.max(0, vs.findIndex(v=>v.name===name));
    const m=loadMap(); m[c] = { index: idx, name: name || (vs[idx] && vs[idx].name) || '' };
    saveMap(m); console.log('[RTG] Saved', c, m[c]);
  };
  window.rtgSetMainVoiceByName = function(name){
    window.RTG_MAIN_SPEAKER = 'A';
    window.rtgSetCharacterVoiceByName('A', name);
  };
  window.RTG_MAIN_SPEAKER = 'A';

  // Pick voice strictly by saved V2 (prefer name, fallback index, fallback round-robin by ABCDEF)
  const DEF_IDX = {A:0,B:1,C:2,D:3,E:4,F:5};
  window.rtgPickVoiceStrict = function(speaker, sampleText){
    const vs = getMandarinVoices();
    const total = vs.length;
    if (!total) return null;
    if (!speaker && sampleText){
      const m = String(sampleText).trim().match(/^([A-F])[:：]/);
      if (m) speaker = m[1];
    }
    speaker = (speaker || 'A').toUpperCase();
    const map = loadMap();
    const entry = map[speaker];
    if (entry && entry.name){
      const byName = vs.find(v => v.name === entry.name);
      if (byName) return byName;
    }
    const idxBase = (entry && typeof entry.index==='number') ? entry.index : (DEF_IDX[speaker]||0);
    const idx = ((idxBase % total) + total) % total;
    return vs[idx] || vs[0];
  };

  // Temporary state để lưu selections trước khi commit
  let tempVoiceSelections = {};

  // Track selections khi change (KHÔNG save vào localStorage)
  document.addEventListener('change', function(ev){
    const sel = ev.target.closest('.rtg-voice-modal select, [data-rtg-voice-char] select');
    if (!sel) return;
    let c = null;
    const wrap = sel.closest('[data-rtg-voice-char]');
    if (wrap) c = String(wrap.getAttribute('data-rtg-voice-char')||'').toUpperCase();
    if (!c){
      // fallback: try to read preceding label like "A" or "B"
      const label = sel.parentElement && sel.parentElement.querySelector('.rtg-voice-label');
      if (label) c = String(label.textContent||'').trim().charAt(0).toUpperCase();
    }
    if (!c || !/[A-F]/.test(c)) return;
    const idx = sel.selectedIndex;
    const name = sel.options[idx] ? sel.options[idx].text.trim() : '';
    // Lưu vào temp state, KHÔNG save vào localStorage
    tempVoiceSelections[c] = { index: idx, name };
    console.log('[RTG] Voice selected (not saved yet):', c, tempVoiceSelections[c]);
  }, true);

  // Listen for save button click
  document.addEventListener('rtg:save-voice-settings', function(){
    if (Object.keys(tempVoiceSelections).length === 0) {
      // Không có thay đổi
      try { if (typeof window.rtgShowToast === 'function') window.rtgShowToast('Không có thay đổi nào!', 'info'); } catch(_){}
      return;
    }
    
    // Commit tất cả selections vào localStorage
    const m = loadMap();
    Object.keys(tempVoiceSelections).forEach(char => {
      m[char] = tempVoiceSelections[char];
    });
    saveMap(m);
    console.log('[RTG] Saved all voice settings:', m);
    
    // Clear temp
    tempVoiceSelections = {};
    
    // Hiển thị toast
    try {
      if (typeof window.rtgShowToast === 'function') {
        window.rtgShowToast('Đã lưu giọng TTS thành công! ✓', 'success');
      }
    } catch(_){}
    
    // Tự động đóng modal sau 1 giây
    setTimeout(() => {
      try {
        const modal = document.querySelector('.rtg-voice-modal');
        if (modal) {
          const closeBtn = modal.querySelector('button[title="Đóng"]');
          if (closeBtn) closeBtn.click();
        }
      } catch(_){}
    }, 1000);
  }, true);

  // "Thử" buttons audition the mapped voice
  document.addEventListener('click', function(ev){
    const btn = ev.target.closest('.rtg-voice-try, [data-rtg-voice-try]');
    if (!btn) return;
    let c = 'A';
    const wrap = btn.closest('[data-rtg-voice-char]');
    if (wrap) c = String(wrap.getAttribute('data-rtg-voice-char')||'A').toUpperCase();
    const u = new SpeechSynthesisUtterance('你好，我是中文发音。');
    u.lang = 'zh-CN';
    try { const v = window.rtgPickVoiceStrict(c, c+': 你好'); if (v) u.voice = v; } catch(_){}
    try { speechSynthesis.cancel(); } catch(_){}
    speechSynthesis.speak(u);
  }, true);

  // Default examples/review -> A if caller doesn't specify
  function patchSpeak(){
    const g = window; const old = g.speakText;
    if (g.__rtgSpeakPatched || typeof old !== 'function') return;
    g.speakText = function(textToSpeak, audioIdToPlay=null, playbackRate=1.0, onEndCallback=null, speaker=null){
      // If passage lines include "B:" etc., keep it; otherwise force A
      if (!speaker){
        const m = String(textToSpeak||'').trim().match(/^([A-F])[:：]/);
        speaker = m ? m[1] : (window.RTG_MAIN_SPEAKER || 'A');
      }
      // Let original handle Blob playback; when falling back to TTS it will call rtgPickVoiceStrict
      return old.apply(this, [textToSpeak, audioIdToPlay, playbackRate, onEndCallback, speaker]);
    };
    g.__rtgSpeakPatched = true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', patchSpeak);
  else patchSpeak();

  // Global example click: force A when line doesn't declare speaker
  const BTN_SEL = [
    '.rtg-explay','.ex-audio','.vd-audio','.ex-play','.example-audio','.example-play',
    '.ex-voice','.vd-voice','.example-voice','[data-ex-tts]','[aria-label="play-example"]'
  ].join(', ');
  const ROW_SEL = '.rtg-example, .ex-line, .vd-item, li, .example-line, .rtg-ex-row';
  const ZH_SEL  = '.ex-cn, .vd-cn, .rtg-zh, .zh, .hanzi, [data-zh]';
  document.addEventListener('click', function(ev){
    const btn = ev.target.closest(BTN_SEL); if(!btn) return;
    const row = btn.closest(ROW_SEL)||btn.parentElement; if(!row) return;
    let cn=''; const zh=row.querySelector(ZH_SEL); if(zh) cn=zh.innerText.trim(); else cn=row.innerText.trim();
    cn = cn.replace(/[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/gi,'').replace(/\s+/g,' ').trim();
    if(!cn) return;
    if (typeof window.speakText==='function'){
      // If text not prefixed with A:..F:, we pass A
      const pref = /^[A-F][:：]/.test(cn) ? null : 'A';
      window.speakText(cn, null, 1.0, null, pref);
      ev.preventDefault(); ev.stopPropagation();
    }
  }, true);
})();
</script>

<script>
(function(){
  function getVoicesAll(){
    const list=(window.speechSynthesis && speechSynthesis.getVoices && speechSynthesis.getVoices())||[];
    return list;
  }
  function getMandarinVoices(){
    const list=getVoicesAll();
    return list.filter(v=>{
      const lang=(v.lang||'').toLowerCase();
      const name=(v.name||'').toLowerCase();
      if(!lang.startsWith('zh')) return false;
      if(lang.includes('hk')||name.includes('cantonese')||name.includes('yue')) return false;
      return lang.includes('zh-cn')||lang.includes('zh-hans')||lang.startsWith('zh');
    });
  }
  function loadMapV2(){
    try{ return JSON.parse(localStorage.getItem('rtgCharacterVoiceMapV2')||'{}')||{}; }catch(_){ return {}; }
  }
  function saveMapV2(m){ try{ localStorage.setItem('rtgCharacterVoiceMapV2', JSON.stringify(m||{})); }catch(_){} }

  function norm(s){
    return String(s||'').toLowerCase()
      .replace(/\([^)]*\)/g,'')   // drop (...) like (zh-CN)
      .replace(/\s+/g,' ')
      .trim();
  }

  // Replace previous change handler (if any) by adding a stronger one at the end of bubble phase
  document.addEventListener('change', function(ev){
    const sel = ev.target.closest('.rtg-voice-modal select, [data-rtg-voice-char] select');
    if (!sel) return;
    const wrap = sel.closest('[data-rtg-voice-char]');
    const c = wrap ? String(wrap.getAttribute('data-rtg-voice-char')||'').toUpperCase() : null;
    if (!c || !/[A-F]/.test(c)) return;
    const idx = sel.selectedIndex;
    const mand = getMandarinVoices();
    const v = mand[idx] || null;
    const m = loadMapV2();
    if (v){
      m[c] = { index: idx, name: v.name || (sel.options[idx] && sel.options[idx].text.trim()) || '',
               uri: v.voiceURI || '', lang: v.lang || '' };
    } else {
      // fallback keep previous but update index
      m[c] = Object.assign({}, m[c]||{}, { index: idx });
    }
    saveMapV2(m);
    console.log('[RTG][SAVE] %s -> %o', c, m[c]);
  }, true);

  // Stronger picker: prefer URI, then exact name, then normalized tokens, then index
  const DEF_IDX = {A:0,B:1,C:2,D:3,E:4,F:5};
  window.rtgPickVoiceStrict = function(speaker, sampleText){
    const vsAll = getVoicesAll();
    const mand = getMandarinVoices();
    const total = mand.length;
    if (!total) return null;
    if (!speaker && sampleText){
      const m = String(sampleText).trim().match(/^([A-F])[:：]/);
      if (m) speaker = m[1];
    }
    const sp = (speaker||'A').toUpperCase();
    const map = loadMapV2();
    const entry = map[sp] || {};
    // 1) URI exact
    if (entry.uri){
      const byUri = vsAll.find(v => v.voiceURI === entry.uri) || mand.find(v=>v.voiceURI===entry.uri);
      if (byUri) { console.log('RTG voice (uri) -> %s %s', sp, byUri.name); return byUri; }
    }
    // 2) Exact name
    if (entry.name){
      const byName = mand.find(v => v.name === entry.name);
      if (byName) { console.log('RTG voice (name) -> %s %s', sp, byName.name); return byName; }
    }
    // 3) Normalized name contains
    if (entry.name){
      const nn = norm(entry.name);
      const fuzzy = mand.find(v => norm(v.name) === nn) || mand.find(v => norm(v.name).includes(nn));
      if (fuzzy) { console.log('RTG voice (norm) -> %s %s', sp, fuzzy.name); return fuzzy; }
    }
    // 4) Index fallback (A..F)
    const idxBase = (typeof entry.index==='number') ? entry.index : (DEF_IDX[sp]||0);
    const idx = ((idxBase % total) + total) % total;
    const fb = mand[idx] || mand[0];
    console.log('RTG voice (idx) -> %s %s', sp, fb && fb.name);
    return fb;
  };

  // Ensure examples/review default to 'A' if none specified
  function patchSpeak(){
    const g=window; const old=g.speakText; if (typeof old!=='function' || g.__rtgSpeakPatched2) return;
    g.speakText = function(textToSpeak, audioIdToPlay=null, playbackRate=1.0, onEndCallback=null, speaker=null){
      if (!speaker){
        const m = String(textToSpeak||'').trim().match(/^([A-F])[:：]/);
        speaker = m ? m[1] : 'A';
      }
      return old.apply(this, [textToSpeak, audioIdToPlay, playbackRate, onEndCallback, speaker]);
    };
    g.__rtgSpeakPatched2 = true;
  }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', patchSpeak);
  else patchSpeak();
})();

        if (!ev.target.closest('#rtg-voice-panel')){
          closePanel();
          // let the underlying click proceed (e.g., open Settings)
        }
      }
    } catch(_) {}
  }, true);

  // ESC to close
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && elPanel && elPanel.style.display === 'block'){
      closePanel();
    }
  }, true);

  if (elToggle) { elToggle.addEventListener('click', openPanel); }
  if (elClose) { elClose.addEventListener('click', closePanel); }

  elSave.addEventListener('click', ()=>{
    const m=load(); const mand=getMand();
    elBody.querySelectorAll('.row').forEach(row=>{
      const L=row.getAttribute('data-char'); const sel=row.querySelector('select');
      const i=sel.selectedIndex; const v=mand[i];
      m[L]={ index:i, name:v&&v.name||'', uri:v&&v.voiceURI||'', lang:v&&v.lang||'' };
    });
    save(m); console.log('[RTG] Saved voices:', m);
  });
  elReset.addEventListener('click', ()=>{
    localStorage.removeItem('rtgCharacterVoiceMapV2'); INIT_DONE=false; buildOnce();
  });

  // Stabilize: only build once when voices list becomes non-empty; ignore further onvoiceschanged to prevent flicker
  function onVoices(){
    if (INIT_DONE) return;
    if (getMand().length){ buildOnce(); }
  }
  if ('onvoiceschanged' in speechSynthesis){
    speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', onVoices) : (speechSynthesis.onvoiceschanged=onVoices);
  } else {
    setTimeout(onVoices, 700);
  }

  // Enforce mapping (kept from TTSfix6): force voice every time
  if (!window.__rtgForceVoiceV7){
    window.__rtgForceVoiceV7=true;
    const DEF=DEF_IDX;
    function resolveVoice(speaker, text){
      const mand=getMand(); const all=getAll(); const total=mand.length||1;
      if (!speaker && text){ const m=String(text).trim().match(/^([A-F])[:：]/); if (m) speaker=m[1]; }
      const sp=(speaker||'A').toUpperCase();
      const e=load()[sp]||{};
      // try by uri/name; then index
      let v=null;
      if (e.uri){ v = all.find(x=>x.voiceURI===e.uri) || mand.find(x=>x.voiceURI===e.uri); }
      if (!v && e.name){ v = all.find(x=>x.name===e.name) || mand.find(x=>x.name===e.name); }
      if (!v){ const idx=((typeof e.index==='number'?e.index:(DEF[sp]||0))%total+total)%total; v=mand[idx]||mand[0]||all[0]||null; }
      return v;
    }
    const oldSpeak = speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak = function(utter){
    const _u = utter;
    try {
      if (_u && _u.__rtgBypassForce) {
        return oldSpeak(_u);
      }
      // derive explicit speaker if present
      let sp = _u && _u.__rtgSpeaker;
      if (!sp && _u && typeof _u.text === 'string') {
        const m = _u.text.trim().match(/^([A-F])[:：]/);
        if (m) sp = m[1];
      }
      // if no explicit speaker and voice already chosen, respect it
      if (!sp && _u && _u.voice) {
        return oldSpeak(_u);
      }
      // otherwise resolve by speaker letter (default 'A' only when we MUST)
      const v = (typeof resolveVoice === 'function') ? resolveVoice(sp, (_u && _u.text) || '') : (typeof pick === 'function' ? pick(sp, (_u && _u.text) || '') : null);
      if (v) { _u.voice = v; _u.lang = _u.lang || v.lang || 'zh-CN'; }
    } catch(e) { console.warn('RTG speak-wrap (respect voice) failed', e); }
    return oldSpeak(_u);
    
};
  }
})();
</script>

<script id="rtg-memonly-script">
    /* === RTG Memory Score Script (Revised Syntax v3) === */
(function() { // Bắt đầu IIFE - giữ nguyên cấu trúc này
    // --- Configuration & Constants ---
    const MEMORY_WRAP_ID = 'rtg-memonly-wrap';
    const CARD_SELECTOR = '.card-3d';
    const INNER_SELECTOR = '.inner';
    const FEEDBACK_LEVELS = {
        'Không biết': -2, 'Ngờ ngợ': -1, 'Đã thuộc': +1, 'Thành thạo': +2
    };

    // --- State Variables ---
    let lastCardNode = null;
    let isUpdatingDOM = false;
    let updateScheduled = false;

    // --- Helper Functions (Đã đúng cú pháp) ---
    function speak(text) {
        try {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            var voices = window.speechSynthesis.getVoices() || [];
            var zh = null;
            for (var i = 0; i < voices.length; i++) {
                var v = voices[i];
                if (/zh|chinese/i.test(v.lang) || /Chinese|Xiaoxiao|Yunxi|Huihui/i.test(v.name)) {
                    zh = v;
                    break;
                }
            }
            if (zh) u.voice = zh;
            u.rate = 1;
            u.pitch = 1;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    function flipCardIfPossible(btn) {
        try {
            var card = btn && btn.closest ? btn.closest('.card-3d') : document.querySelector('.card-3d');
            if (!card) return;
            var flipArea = card.querySelector('.inner, [class*=cursor-pointer], .card-3d');
            if (flipArea) {
                var evt = new MouseEvent('click', { bubbles: true });
                flipArea.dispatchEvent(evt);
            }
        } catch (e) {}
    }

    // --- Core Logic ---

    /** Xử lý sự kiện click trên các nút feedback (Định nghĩa hàm riêng) */
    function handleFeedbackClick(e) {
        try {
            var target = e.target;
            var btn = target && target.closest ? target.closest('button') : null;
            if (!btn) return;
            var txt = (btn.textContent || '').trim();
            if (!(txt in FEEDBACK_LEVELS)) return;

            // Giả định các hàm này được định nghĩa ở đâu đó bên ngoài IIFE hoặc trước đó
            var key = typeof findHanziFrom === 'function' ? findHanziFrom(btn) : null;
            if (!key) return;
            if (typeof bumpScore === 'function') bumpScore(key, FEEDBACK_LEVELS[txt]);
            if (typeof updateBar === 'function') updateBar(key);
            flipCardIfPossible(btn);
            speak(key);
        } catch (err) { /* swallow */ }
    }

    // Gắn hàm xử lý click vào document
    document.addEventListener('click', handleFeedbackClick, true);

    // --- Throttled DOM observer ---
    // Hàm callback cho MutationObserver (Đã đúng cú pháp)
    function onDomIdle() {
        updateScheduled = false;
        if (isUpdatingDOM) return; // Ngăn chặn vòng lặp do chính script gây ra
        try {
            var card = document.querySelector('.card-3d');
            if (!card) {
                if (typeof updateBar === 'function') updateBar(null);
                lastCardNode = null; // Reset card cuối
                return;
            }

            // Di chuyển thanh memory nếu cần
            isUpdatingDOM = true; // Đặt cờ trước khi thay đổi DOM
            try {
                if (typeof ensureBar === 'function') ensureBar(); // Giả định hàm ensureBar đã định nghĩa
                var wrap = document.getElementById('rtg-memonly-wrap');
                var anchor = card.parentElement && card.parentElement.parentElement ? card.parentElement.parentElement : card.parentElement || card;
                if (wrap && anchor && anchor.parentNode && anchor.previousSibling !== wrap) { // Sửa lỗi kiểm tra parentElement
                   anchor.parentNode.insertBefore(wrap, anchor);
                }
            } finally {
                 isUpdatingDOM = false; // Luôn bỏ cờ sau khi xong
            }


            if (card !== lastCardNode) {
                lastCardNode = card;
                var k = typeof findHanziFrom === 'function' ? findHanziFrom(card) : null; // Giả định hàm findHanziFrom đã định nghĩa
                if (typeof updateBar === 'function') updateBar(k); // Giả định hàm updateBar đã định nghĩa
            }
        } catch (e) {
             isUpdatingDOM = false; // Đảm bảo bỏ cờ nếu có lỗi
             /* swallow */
        }
    }

    // Hàm điều tiết (throttle) gọi onDomIdle
    function scheduleDomUpdate() {
        if (updateScheduled) return;
        updateScheduled = true;
        setTimeout(onDomIdle, 120); // throttle
    }

    // Hàm callback cho MutationObserver (Định nghĩa hàm riêng)
    function handleMutation() {
        scheduleDomUpdate(); // Gọi hàm điều tiết
    }

    // Tạo MutationObserver với hàm đã định nghĩa
    var obs = new MutationObserver(handleMutation);

    // Hàm bắt đầu quan sát (Đã đúng cú pháp)
    function startObserver() {
        try {
            obs.observe(document.body || document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
    }

    // Hàm khởi tạo (Đã đúng cú pháp)
    function init() {
        // Giả định các hàm ensureStyle, ensureBar, updateBar đã được định nghĩa
        if (typeof ensureStyle === 'function') ensureStyle();
        if (typeof ensureBar === 'function') ensureBar();
        if (typeof updateBar === 'function') updateBar(null);
        startObserver();
    }

    // Chạy khởi tạo khi DOM sẵn sàng
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})(); // Kết thúc IIFE
</script>




<script id="rtg-minimal-flip-speak">
(function(){
  const LABELS = ['Không biết','Ngờ ngợ','Đã thuộc','Thành thạo'];
  function flipCard(){
    try{ var inner = document.querySelector('.card-3d .inner'); if(inner) inner.classList.toggle('flipped'); }catch(e){}
  }
  function getHanzi(){
    const root = document.querySelector('.card-3d') || document;
    const sels = ['.big-hanzi','.hanzi','.text-6xl','.text-9xl','.rtg-hanzi','.rtg-zh','.zh'];
    for (const sel of sels){
      try{ const el = root.querySelector(sel); if (el && el.textContent && el.textContent.trim()) return el.textContent.trim(); }catch(e){}
    }
    return '';
  }
  function speakZH(text){
    if(!text) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; u.rate=1.0;
      const vs = speechSynthesis.getVoices()||[];
      const v = vs.find(vv=>/zh|chinese/i.test((vv.lang||'')+' '+(vv.name||'')))||null;
      if(v){ u.voice=v; if(!u.lang) u.lang=v.lang||'zh-CN'; }
      speechSynthesis.speak(u);
    }catch(e){}
  }
  document.addEventListener('click', function(ev){
    const btn = ev.target.closest('button'); if(!btn) return;
    const label = (btn.textContent||'').trim();
    if (LABELS.some(t=>label.includes(t))){
      // Only perform our action; don't touch app state beyond this
      flipCard();
      const hz = getHanzi(); if(hz) speakZH(hz);
    }
  }, true);
})();
</script>
<script id="rtg-guarded-mount">

    if (!rootEl || !window.React || !window.ReactDOM || !window.App){ setTimeout(mountGuarded, 50); return; }
    if (!window.__RTG_ROOT){
      try{ window.__RTG_ROOT = ReactDOM.createRoot(rootEl); }
      catch(e){ try{ ReactDOM.createRoot(rootEl).unmount?.(); }catch(_){} window.__RTG_ROOT = ReactDOM.createRoot(rootEl); }
    }
    if (window.__RTG_MOUNTED) return;
    window.__RTG_MOUNTED = true;
    window.__RTG_ROOT.render(React.createElement(App));
  }
  mountGuarded();
})();
</script>
