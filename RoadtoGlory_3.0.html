<!-- RTG EARLY HOOK v2: capture current lesson id via app logs -->
<script>
(function(){
  try{
    if (window.__RTG_earlyHookedV2) return; window.__RTG_earlyHookedV2 = true;
    const LS_LESSONS='chineseVocabLessons';
    const RTG_CUR_ID='rtg_currentLessonId';
    const RTG_CUR_NAME='rtg_currentLessonName';
    const origLog = console.log;localStorage.removeItem('rtg_compiled_1.2.boot11');
    console.log = function(){
      const args = arguments; // define at top-level of wrapper
      try{
        if (args && typeof args[0]==='string'){
          if (/Vocabularies for selected lesson updated/i.test(args[0]) && Array.isArray(args[1])){
            const sig = JSON.stringify((args[1]||[]).map(v => (v && (v.chinese||v.hanTu)||'')).sort());
            const lessons = JSON.parse(localStorage.getItem(LS_LESSONS)||'[]');
            for (const ls of lessons){
              const lsSig = JSON.stringify(((ls&&ls.vocabularies)||[]).map(v => (v&&(v.chinese||v.hanTu)||'')).sort());
              if (lsSig === sig){
                localStorage.setItem(RTG_CUR_ID, JSON.stringify(ls.id));
                localStorage.setItem(RTG_CUR_NAME, JSON.stringify(ls.name||''));
                break;
              }
            }
          }
        }
      }catch(e){ /* swallow */ }
      try { return origLog.apply(console, args); } catch(_){ try { return Function.prototype.apply.call(origLog, console, args); } catch(__){ return; } }
    };
  }catch(e){}
})();
</script>

<script>
/* RTG Boot v4: wait for React, cache compiled JSX, robust order */
(function(){
  var VER = '1.2.boot11';
  var KEY = 'rtg_compiled_' + VER;
  function run(code){ try{ new Function(code)(); }catch(e){ console.error('RTG run error', e); } }
  function ensureReact(cb){
    if (window.React && window.ReactDOM) { cb(); return; }
    var fired = false;
    function tryRun(){ if (!fired && window.React && window.ReactDOM){ fired = true; cb(); } }
    document.addEventListener('DOMContentLoaded', tryRun);
    window.addEventListener('load', tryRun);
    // Also poll quickly for safety in case scripts load before events
    var t = setInterval(function(){ if (window.React && window.ReactDOM){ clearInterval(t); tryRun(); } }, 30);
    setTimeout(function(){ clearInterval(t); }, 3000);
  }
  function ensureBabel(cb){
    if (window.Babel) { cb(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://unpkg.com/@babel/standalone/babel.min.js';
    sc.onload = cb; sc.defer = true;
    document.head.appendChild(sc);
  }
  function firstRun(){
    var srcEl = document.getElementById('rtg-app-src');
    var code = srcEl ? srcEl.textContent : '';
    ensureBabel(function(){
      try{
        var out = Babel.transform(code, { presets: ['react'] }).code;
        try{ localStorage.setItem(KEY, out); }catch(_){}
        ensureReact(function(){ run(out); });
      }catch(e){ console.error('Babel compile error', e); }
    });
  }
  try{
    var cached = localStorage.getItem(KEY);
    if (cached){ ensureReact(function(){ run(cached); }); return; }
  }catch(_){}
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', firstRun);
  } else {
    firstRun();
  }
})();
</script>

<!-- ===== RTG Streak Core v4 (canonicalize + shield logic + legacy mirror) ===== -->
<script>
(function(){
  const TZ = 'Asia/Ho_Chi_Minh';
  const TODAY = () => new Date().toLocaleDateString('sv-SE', { timeZone: TZ }); // YYYY-MM-DD
  const dParse = (s) => { const d = new Date(s); return isNaN(d) ? null : d; };
  const dayDiff = (a,b) => {
    const da = dParse(a+'T00:00:00'); const db = dParse(b+'T00:00:00');
    return Math.round((db - da)/86400000);
  };

  const KEY = { streak:'rtg_streak', last:'rtg_lastCheckInDate', shields:'rtg_streak_shields', auto:'rtg_streak_auto_use', pack:'rtg_checkin_pack' };
  const LEG_STREAK = ['checkInStreak','dailyStreak','currentStreak','chineseCheckInStreak'];
  const LEG_LAST   = ['lastCheckIn','last_check_in','lastCheckInDate','last_checkin_date','chineseLastCheckInDate'];

  const _origSetItem = localStorage.setItem.bind(localStorage);

  const jget = (k) => {
    let v = localStorage.getItem(k);
    try { return JSON.parse(v); } catch { return v; }
  };
  const jset = (k,v) => _origSetItem(k, (typeof v==='string' ? v : JSON.stringify(v)));

  function mirror(streak, lastISODate){
    try {
      const pack = jget(KEY.pack) || {};
      pack.streak = Number(streak||0);
      pack.last   = String(lastISODate||'');
      jset(KEY.pack, pack);
    } catch(_) {}
    LEG_STREAK.forEach(k=> jset(k, Number(streak||0)));
    LEG_LAST.forEach(k  => jset(k, String(lastISODate||'')));
    jset('chineseCheckInStreak', Number(streak||0));
    try {
      const isoVN = new Date(String(lastISODate)+'T00:00:00+07:00').toISOString();
      jset('chineseLastCheckInDate', isoVN);
    } catch(_) {
      jset('chineseLastCheckInDate', String(lastISODate||''));
    }
  }

  function loadState(){
    let streak = Number(jget(KEY.streak) || 0);
    let last   = jget(KEY.last) || '';
    let shields= Number(jget(KEY.shields) || 0);
    let auto   = (String(jget(KEY.auto))!=='false');

    if (!streak) {
      const c = LEG_STREAK.map(jget).find(v => v!=null && v!=='');
      if (c!=null) streak = Number(c)||0;
    }
    if (!last) {
      const c = LEG_LAST.map(jget).find(v => v!=null && v!=='');
      if (c) {
        if (typeof c === 'string') last = c.slice(0,10);
        else if (c && typeof c==='object' && c.last) last = String(c.last).slice(0,10);
      }
    }
    if (!last) last = TODAY();

    jset(KEY.streak, Number(streak||0));
    jset(KEY.last,   String(last));
    jset(KEY.shields, Number(shields||0));
    jset(KEY.auto,   !!auto);
    mirror(streak,last);

    const autoLegacy = jget('autoShield'); 
    if (typeof autoLegacy !== 'undefined' && autoLegacy !== null) {
      auto = String(autoLegacy)!=='false';
      jset(KEY.auto, !!auto);
    }
    const autoUseShield = jget('autoUseShield'); 
    if (typeof autoUseShield !== 'undefined' && autoUseShield !== null) {
      auto = String(autoUseShield)!=='false';
      jset(KEY.auto, !!auto);
    }
    return {streak, last, shields, auto};
  }

  function saveState({streak, last, shields, auto}){
    jset(KEY.streak, Number(streak||0));
    jset(KEY.last,   String(last||TODAY()));
    jset(KEY.shields, Number(shields||0));
    jset(KEY.auto, !!auto);
    mirror(streak,last);
    jset('autoUseShield', !!auto);
    jset('autoShield', !!auto);
  }

  function _applyShieldIfNeeded(prevStreak, prevLast, today){
    let {streak,last,shields,auto} = loadState();
    if (prevStreak!=null) streak = Number(prevStreak);
    if (prevLast) last = String(prevLast).slice(0,10);

    const gap = dayDiff(last, today);
    if (gap === 2 && shields > 0) {
      let use = !!auto;
      if (!auto) {
        try { use = window.confirm('Bạn đã bỏ lỡ 1 ngày. Dùng lá chắn để giữ streak?'); } catch(_) {}
      }
      if (use) {
        shields = Math.max(0, shields-1);
        streak = Number(streak||0) + 1;
        last = today;
        saveState({streak,last,shields,auto});
        return {status:'shielded', streak,last,shields,auto};
      }
    }
    return {status:'not-used', streak,last,shields,auto};
  }

  async function handleCheckIn({askConfirm=window.confirm}={}){
    let {streak,last,shields,auto} = loadState();
    const today = TODAY();
    if (last === today) {
      saveState({streak,last,shields,auto});
      return {status:'already', streak,last,shields,auto};
    }
    const gap = dayDiff(last, today);
    if (gap<=1){
      streak = Number(streak||0) + 1;
      last = today;
      saveState({streak,last,shields,auto});
      return {status:'ok', streak,last,shields,auto};
    }
    if (gap===2 && shields>0){
      let use = !!auto;
      if (!auto && typeof askConfirm==='function'){
        use = askConfirm('Bạn đã bỏ lỡ 1 ngày. Dùng lá chắn để giữ streak?');
      }
      if (use){
        shields = Math.max(0, shields-1);
        streak = Number(streak||0) + 1;
        last = today;
        saveState({streak,last,shields,auto});
        return {status:'shielded', streak,last,shields,auto};
      }
    }
    streak = 1; last = today;
    saveState({streak,last,shields,auto});
    return {status:'reset', streak,last,shields,auto};
  }

  window.RTG_STREAK = { loadState, saveState, handleCheckIn, mirror };

  // Normalize khi load
  loadState();

  // API tiện dụng cho UI
  window.RTG_checkInToday = async function(){
    const res = await handleCheckIn({});
    try { window.dispatchEvent(new CustomEvent('rtg:streak-updated', { detail: res })); } catch(_){}
    return res;
  };
})();
</script>

<script>
(function(){
  // Đo chính xác chiều cao header và set --header-h => body padding-top
  function updateHeaderOffset(){
    var h = document.querySelector('.rtg-header');
    if(!h) return;
    var hh = Math.round(h.getBoundingClientRect().height || 64);
    document.documentElement.style.setProperty('--header-h', hh + 'px');
    // Body padding đã dùng var(--header-h); không cần set trực tiếp, nhưng
    // nếu theme khác override thì set thêm một lần cho chắc:
    document.body.style.paddingTop = 'var(--header-h, '+hh+'px)';
  }
  // Chạy khi load, khi resize và khi DOM thay đổi (header render sau React)
  window.addEventListener('load', updateHeaderOffset);
  window.addEventListener('resize', updateHeaderOffset);
  var mo = new MutationObserver(function(){ updateHeaderOffset(); });
  mo.observe(document.documentElement, {childList:true, subtree:true});

  // Nếu có skeleton/fade-in, delay nhẹ để đo lại sau khi header ổn định
  setTimeout(updateHeaderOffset, 200);
})();
</script>

          el.style.color = msg && msg.type==='error' ? '#991b1b' : (msg && msg.type==='success' ? '#065f46' : '#1e3a8a');

          toastBox.appendChild(el);
          setTimeout(function(){ el.style.transition='opacity .4s ease, transform .4s ease'; el.style.opacity='0'; el.style.transform='translateY(8px)'; }, 2200);

<script>
(function () {
  // ====== 1) BẮT CLICK TRÊN NÚT LOA (selector rộng + heuristics) ======
  const BTN_SEL = [
    '.rtg-explay', '.ex-audio', '.vd-audio', '.ex-play', '.example-audio',
    '.example-play', '.ex-voice', '.vd-voice', '.example-voice',
    '[data-ex-tts]', '[aria-label="play-example"]',
    // thường icon trong <i>/<svg>/<span> có class chứa voice/sound/volume/audio/mic/speaker
    'i[class*="voice"]', 'i[class*="sound"]', 'i[class*="volume"]', 'i[class*="audio"]', 'i[class*="speaker"]', 'i[class*="mic"]',
    'svg[class*="voice"]', 'svg[class*="sound"]', 'svg[class*="volume"]', 'svg[class*="audio"]', 'svg[class*="speaker"]', 'svg[class*="mic"]',
    'span[class*="voice"]', 'span[class*="sound"]', 'span[class*="volume"]', 'span[class*="audio"]', 'span[class*="speaker"]', 'span[class*="mic"]',
    'button[class*="voice"]', 'button[class*="sound"]', 'button[class*="volume"]', 'button[class*="audio"]', 'button[class*="speaker"]', 'button[class*="mic"]'
  ].join(', ');

  const ROW_SEL = '.rtg-example, .ex-line, .vd-item, li, .example-line, .rtg-ex-row';
  const ZH_SEL  = '.ex-cn, .vd-cn, .rtg-zh, .zh, .hanzi, [data-zh]';

  // Bắt click toàn cục (event delegation)
  document.addEventListener('click', function (ev) {
    let btn = ev.target.closest(BTN_SEL);
    // Heuristic bổ sung: nếu className có từ khóa audio/voice/sound/volume/mic/speaker thì coi như nút
    if (!btn) {
      const c = (ev.target.className || '').toString().toLowerCase();
      if (/(audio|voice|sound|volume|speaker|mic)/.test(c)) btn = ev.target;
    }
    if (!btn) return;

    const row = btn.closest(ROW_SEL) || btn.parentElement;
    if (!row) return;

    // Lấy chữ Hán: innerText tự bỏ mọi <span> bôi đỏ
    let cn = '';
    const zhNode = row.querySelector(ZH_SEL);
    if (zhNode) cn = zhNode.innerText.trim();
    else cn = row.innerText.replace(/\s*[-–—]\s*.+$/, '').trim();

    // Loại pinyin/ký tự latin nếu lỡ dính chung
    cn = cn
      .replace(/[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();

    if (!cn) return;
    playZH(cn);
  }, true);

  // ====== 2) PHÁT TTS TIẾNG TRUNG (Web Speech) ======
  function playZH(text) {
    try { speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 1.0;

    let voices = speechSynthesis.getVoices();
    if (!voices || !voices.length) {
      let tries = 0;
      const t = setInterval(() => {
        voices = speechSynthesis.getVoices();
        if ((voices && voices.length) || ++tries > 15) {
          clearInterval(t);
          chooseAndSpeak(u, voices || []);
        }
      }, 150);
    } else {
      chooseAndSpeak(u, voices);
    }
  }

  function chooseAndSpeak(u, voices) {
  try {
    var v = null;
    if (window.rtgPickVoiceStrict) {
      try { v = window.rtgPickVoiceStrict('A', 'A: ' + (((u && u.text) ? u.text : ''))); } catch(_) { v = null; }
    }
    if (!v && window.resolveVoice) {
      try { v = window.resolveVoice('A', ((u && u.text) ? u.text : '')); } catch(_) { v = null; }
    }
    if (!v && Array.isArray(voices) && voices.length) {
      v = voices.find(function(vv){
        var s = String((vv && vv.lang) || '') + ' ' + String((vv && vv.name) || '');
        s = s.toLowerCase();
        return /zh|chinese/.test(s) && !/yue|cantonese|hk/.test(s);
      }) || null;
    }
    if (v) {
      u.voice = v;
      if (!u.lang) u.lang = v.lang || 'zh-CN';
    }
  } catch(e) { /* no-op */ }
  try { speechSynthesis.resume(); } catch(_){}
  speechSynthesis.speak(u);
}
})();
</script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>
    
    <!-- Quill Editor for Journal -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <!-- SheetJS for Excel Import -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <!-- Azure Speech Services & Popup Helpers -->
    <script>
    // ==================== POPUP SYSTEM (Thay thế alert) ====================
    window.showPopup = function(options) {
        const {
            message = '',
            type = 'info', // success, error, info, warning, question
            title = '',
            confirmText = 'OK',
            cancelText = 'Hủy',
            onConfirm = null,
            onCancel = null,
            showCancel = false
        } = options;

        // Remove existing popup
        const existing = document.getElementById('rtg-custom-popup');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'rtg-custom-popup';
        overlay.className = 'rtg-popup-overlay';

        const icons = {
            success: '✓',
            error: '✕',
            info: 'ℹ',
            warning: '⚠',
            question: '?'
        };

        const titles = {
            success: title || 'Thành công',
            error: title || 'Lỗi',
            info: title || 'Thông báo',
            warning: title || 'Cảnh báo',
            question: title || 'Xác nhận'
        };

        overlay.innerHTML = `
            <div class="rtg-popup">
                <div class="rtg-popup-header">
                    <div class="rtg-popup-icon ${type}">${icons[type]}</div>
                    <div class="rtg-popup-title">${titles[type]}</div>
                </div>
                <div class="rtg-popup-message">${message}</div>
                <div class="rtg-popup-buttons">
                    ${showCancel ? `<button class="rtg-popup-btn rtg-popup-btn-secondary" id="rtg-popup-cancel">${cancelText}</button>` : ''}
                    <button class="rtg-popup-btn ${type === 'error' || type === 'warning' ? 'rtg-popup-btn-danger' : 'rtg-popup-btn-primary'}" id="rtg-popup-confirm">${confirmText}</button>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        const confirmBtn = document.getElementById('rtg-popup-confirm');
        const cancelBtn = document.getElementById('rtg-popup-cancel');

        const close = () => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 200);
        };

        confirmBtn.onclick = () => {
            close();
            if (onConfirm) onConfirm();
        };

        if (cancelBtn) {
            cancelBtn.onclick = () => {
                close();
                if (onCancel) onCancel();
            };
        }

        overlay.onclick = (e) => {
            if (e.target === overlay) {
                close();
                if (onCancel) onCancel();
            }
        };

        // ✅ Auto close for non-question types after 1.5s
        if (type !== 'question' && !showCancel) {
            setTimeout(() => {
                if (document.getElementById('rtg-custom-popup')) close();
            }, 1500); // Changed from 5000 to 1500
        }

        return { close };
    };

    // Override window.alert
    window.alert = function(message) {
        showPopup({ message, type: 'info' });
    };

    window.confirm = function(message) {
        return new Promise((resolve) => {
            showPopup({
                message,
                type: 'question',
                confirmText: 'Xác nhận',
                cancelText: 'Hủy',
                showCancel: true,
                onConfirm: () => resolve(true),
                onCancel: () => resolve(false)
            });
        });
    };

    // ==================== AZURE SPEECH SERVICES ====================
    window.AzureSpeech = {
        // Store mediaStream to reuse (avoid asking permission multiple times)
        cachedMediaStream: null,

        // Lấy config từ localStorage
        getConfig() {
            return {
                enabled: localStorage.getItem('azure_enabled') === 'true',
                key: localStorage.getItem('azure_key1') || localStorage.getItem('azure_key2') || '',
                region: localStorage.getItem('azure_region') || '',
                endpoint: localStorage.getItem('azure_endpoint') || '',
                voices: JSON.parse(localStorage.getItem('azure_voices') || '{"A":"zh-CN-XiaoxiaoNeural","B":"zh-CN-YunxiNeural","C":"zh-CN-YunjianNeural","D":"zh-CN-XiaoyiNeural","E":"zh-CN-YunyangNeural","F":"zh-CN-XiaochenNeural"}')
            };
        },

        // Normalize text for comparison (remove punctuation, trim spaces)
        normalizeText(text) {
            if (!text) return '';
            // Remove all punctuation marks (both Chinese and English)
            // Keep only Chinese characters, letters, and numbers
            return text
                // Remove Chinese punctuation
                .replace(/[，。！？、；：""''（）《》【】『』「」…—·～]/g, '')
                // Remove English punctuation  
                .replace(/[,\.!?\-;:'"()\[\]{}]/g, '')
                // Remove whitespace
                .replace(/\s+/g, '')
                .trim()
                .toLowerCase();
        },

        // Text-to-Speech using Azure (OPTIMIZED: Multi-Style Support)
        async speak(text, role = 'A', rate = 1.0) {
            const config = this.getConfig();
            // Kiểm tra cấu hình
            if (!config.enabled || !config.key || !config.region) {
                return this.fallbackTTS(text);
            }

            try {
                // 1. KHAI BÁO BIẾN VOICE (Luôn ở đầu)
                const voice = config.voices[role] || 'zh-CN-XiaoxiaoNeural';

                // 2. BẢN ĐỒ STYLE CHO TỪNG GIỌNG (Cấu hình tay để tối ưu cảm xúc)
                // Nếu giọng hỗ trợ 'chat', ưu tiên dùng. Nếu không, dùng 'cheerful' (vui vẻ).
                const voiceStyleMap = {
                    // --- Nhóm hỗ trợ CHAT (Tự nhiên nhất) ---
                    'zh-CN-XiaoxiaoNeural': 'chat',
                    'zh-CN-YunxiNeural': 'chat',
                    'zh-CN-XiaoyiNeural': 'chat',
                    'zh-CN-XiaomengNeural': 'chat',  // Trẻ con
                    'zh-CN-XiaomoNeural': 'chat',    // Nữ, trưởng thành
                    'zh-CN-XiaozhenNeural': 'cheerful', // Không có chat, dùng cheerful
                    
                    // --- Nhóm hỗ trợ CHEERFUL (Vui vẻ - Thay thế tốt cho Chat) ---
                    'zh-CN-XiaohanNeural': 'cheerful',
                    'zh-CN-XiaoxuanNeural': 'cheerful',
                    'zh-CN-XiaoruiNeural': 'calm',      // Giọng già, điềm đạm
                    'zh-CN-XiaoshuangNeural': 'cheerful', // Trẻ em
                    'zh-CN-YunyangNeural': 'customerservice', // Tin tức -> Chuyển sang CSKH cho đỡ cứng
                    'zh-CN-YunjianNeural': 'cheerful',  // Thể thao -> Vui vẻ
                    'zh-CN-YunfengNeural': 'cheerful',
                    'zh-CN-YunhaoNeural': 'cheerful',
                    'zh-CN-YunxiaNeural': 'cheerful',
                    'zh-CN-YunyeNeural': 'calm',
                    'zh-CN-YunzeNeural': 'calm'
                };

                // Lấy style phù hợp, mặc định là null nếu giọng lạ không có trong list
                const selectedStyle = voiceStyleMap[voice] || null;

                // 3. Tạo nội dung cơ bản
                let innerSsml = `
                    <prosody rate='${rate}'>
                        ${this.escapeXml(text)}
                    </prosody>
                `;

                // 4. Áp dụng thẻ cảm xúc nếu tìm thấy style phù hợp
                // styledegree='1.3' giúp tăng cường độ biểu cảm thêm 30%
                if (selectedStyle) {
                    innerSsml = `
                        <mstts:express-as style='${selectedStyle}' styledegree='1.3'>
                            ${innerSsml}
                        </mstts:express-as>
                    `;
                }

                // 5. Đưa vào khung SSML chuẩn
                const ssml = `
                    <speak version='1.0' xmlns:mstts='https://www.w3.org/2001/mstts' xml:lang='zh-CN'>
                        <voice name='${voice}'>
                            ${innerSsml}
                        </voice>
                    </speak>
                `;

                const url = `https://${config.region}.tts.speech.microsoft.com/cognitiveservices/v1`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Ocp-Apim-Subscription-Key': config.key,
                        'Content-Type': 'application/ssml+xml',
                        'X-Microsoft-OutputFormat': 'audio-16khz-128kbitrate-mono-mp3'
                    },
                    body: ssml
                });

                if (!response.ok) {
                    // Nếu style bị lỗi (do Azure thay đổi), thử fallback về giọng thường không style
                    console.warn('Azure TTS style error, retrying without style...');
                    if (selectedStyle) {
                        return this.speakWithoutStyle(text, voice, rate, config);
                    }
                    return this.fallbackTTS(text);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                
                return new Promise((resolve, reject) => {
                    audio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                        resolve();
                    };
                    audio.onerror = (e) => {
                        URL.revokeObjectURL(audioUrl);
                        reject(e);
                    };
                    audio.play().catch(reject);
                });
            } catch (error) {
                console.error('Azure TTS failed, using fallback:', error);
                return this.fallbackTTS(text);
            }
        },

        // Hàm phụ: Đọc không style (dự phòng khi style bị lỗi)
        async speakWithoutStyle(text, voice, rate, config) {

        // Đọc từng câu trong bài khoá
        async speakSentences(sentences, onProgress = null) {
            for (let i = 0; i < sentences.length; i++) {

        // Convert AudioBuffer to WAV format
        audioBufferToWav(buffer) {
            const length = buffer.length * buffer.numberOfChannels * 2;
            const arrayBuffer = new ArrayBuffer(44 + length);
            const view = new DataView(arrayBuffer);
            const channels = [];
            let offset = 0;
            let pos = 0;

            // Write WAV header
            const setString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            // RIFF chunk descriptor
            setString(0, 'RIFF');
            view.setUint32(4, 36 + length, true);
            setString(8, 'WAVE');

            // fmt sub-chunk
            setString(12, 'fmt ');
            view.setUint32(16, 16, true); // fmt chunk size
            view.setUint16(20, 1, true); // audio format (1 = PCM)
            view.setUint16(22, buffer.numberOfChannels, true);
            view.setUint32(24, buffer.sampleRate, true);
            view.setUint32(28, buffer.sampleRate * buffer.numberOfChannels * 2, true); // byte rate
            view.setUint16(32, buffer.numberOfChannels * 2, true); // block align
            view.setUint16(34, 16, true); // bits per sample

            // data sub-chunk
            setString(36, 'data');
            view.setUint32(40, length, true);

            // Write interleaved audio data
            const volume = 1;
            offset = 44;
            for (let i = 0; i < buffer.numberOfChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }

            while (pos < buffer.length) {
                for (let i = 0; i < buffer.numberOfChannels; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][pos] * volume));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
                pos++;
            }

            return arrayBuffer;
        },

        // Convert WebM audio to WAV format (16kHz mono for Azure)
        async convertToWav(audioBlob) {
            console.log('Converting audio to WAV...');
            try {
                // Create audio context with 16kHz sample rate (Azure requirement)
                const audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });

                // Convert blob to array buffer
                const arrayBuffer = await audioBlob.arrayBuffer();

                // Decode audio data
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                console.log('Audio decoded:', audioBuffer.duration, 'seconds');

                // Convert to WAV
                const wavBuffer = this.audioBufferToWav(audioBuffer);
                console.log('Audio converted to WAV successfully');

                return new Blob([wavBuffer], { type: 'audio/wav' });
            } catch (error) {
                console.error('Failed to convert audio to WAV:', error);
                throw error;
            }
        },

        // Speech-to-Text using Azure (Pronunciation Assessment)
        async assessPronunciation(audioBlob, referenceText) {

                const response = await fetch(`${url}?${params}`, {

                    headers: {

                        'Content-Type': 'audio/wav; codecs=audio/pcm; samplerate=16000',
                        'Pronunciation-Assessment': assessmentBase64
                    },
                    body: wavBlob  // ✅ Send WAV instead of WebM!
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Azure STT error:', response.status, errorText);
                    throw new Error(`Azure STT error: ${response.status} - ${errorText}`);
                }

                const result = await response.json();

                console.log('Reference Text (Expected):', referenceText);
                console.log('Recognized Text (Actual):', result.NBest?.[0]?.Display || 'N/A');
                console.log('Pronunciation Score:', result.NBest?.[0]?.PronunciationAssessment?.PronScore || 0);
                console.log('==========================================');

            } catch (error) {

        // Parse pronunciation assessment result (UPGRADED: Phoneme + Prosody + Miscue)
        parsePronunciationResult(result) {
            if (!result.NBest || result.NBest.length === 0) {
                return null;
            }

            const best = result.NBest[0];
            const recognizedText = best.Display || '';
            
            // ✅ Lấy điểm tổng từ best.*
            const pa = best.PronunciationAssessment || {};
            
            const parsed = {
                // Điểm tổng
                accuracyScore: best.AccuracyScore || pa.AccuracyScore || 0,
                fluencyScore: best.FluencyScore || pa.FluencyScore || 0,
                completenessScore: best.CompletenessScore || pa.CompletenessScore || 0,
                pronunciationScore: best.PronScore || pa.PronScore || 0,
                prosodyScore: best.ProsodyScore || pa.ProsodyScore || 0,  // ✅ NEW: Ngữ điệu
                
                recognizedText: recognizedText,
                normalizedRecognizedText: this.normalizeText(recognizedText),
                
                // ✅ UPGRADED: Parse chi tiết từng từ với Syllables + Phonemes
                words: (best.Words || []).map(w => {
                    const wpa = w.PronunciationAssessment || {};
                    
                    // Parse syllables first
                    const syllables = (w.Syllables || []).map(s => ({
                        syllable: s.Syllable || '',
                        grapheme: s.Grapheme || '',
                        accuracyScore: s.PronunciationAssessment?.AccuracyScore || 
                                     s.AccuracyScore || 0,
                        offset: s.Offset,
                        duration: s.Duration
                    }));
                    
                    // Parse phonemes
                    const phonemes = (w.Phonemes || []).map(p => ({
                        phoneme: p.Phoneme || '',
                        accuracyScore: p.PronunciationAssessment?.AccuracyScore || 
                                     p.AccuracyScore || 0,
                        offset: p.Offset,
                        duration: p.Duration
                    }));
                    
                    // ✅ FIX: Try multiple paths to get word accuracy
                    let wordAccuracy = w.AccuracyScore || wpa.AccuracyScore || 0;
                    
                    // Fallback 1: calculate from syllables if word score is 0
                    if (wordAccuracy === 0 && syllables.length > 0) {
                        const syllableScores = syllables.map(s => s.accuracyScore).filter(score => score > 0);
                        if (syllableScores.length > 0) {
                            wordAccuracy = syllableScores.reduce((sum, score) => sum + score, 0) / syllableScores.length;
                        }
                    }
                    
                    // Fallback 2: calculate from phonemes if still 0
                    if (wordAccuracy === 0 && phonemes.length > 0) {
                        const phonemeScores = phonemes.map(p => p.accuracyScore).filter(score => score > 0);
                        if (phonemeScores.length > 0) {
                            wordAccuracy = phonemeScores.reduce((sum, score) => sum + score, 0) / phonemeScores.length;
                        }
                    }
                    
                    // ✅ Fallback 3: Sử dụng overall pronunciation score nếu vẫn không có data
                    if (wordAccuracy === 0 && (best.PronScore || pa.PronScore)) {
                        wordAccuracy = best.PronScore || pa.PronScore || 0;
                    }
                    
                    return {
                        word: w.Word,
                        accuracyScore: Math.round(wordAccuracy), // Round to integer
                        errorType: wpa.ErrorType || 'None',
                        syllables: syllables,
                        phonemes: phonemes,
                        offset: w.Offset,
                        duration: w.Duration
                    };
                })
            };
            
            // ✅ Store sentence metadata for lesson summary (will be added by caller)
            parsed.sentenceId = null;
            parsed.hanzi = null;
            parsed.pinyinRef = null;
            parsed.syllableStats = [];
            
            return parsed;
        },

        // ==================== PINYIN PARSING UTILITIES ====================
        
        INITIALS: [
            "zh", "ch", "sh",
            "b","p","m","f",
            "d","t","n","l",
            "g","k","h",
            "j","q","x",
            "z","c","s",
            "r","y","w"
        ],
        
        // ✅ Valid finals (39 finals) - MUST match exactly
        VALID_FINALS: [
            "a", "o", "e", "i", "u", "ü", "v",  // Single vowels (v = ü in some systems)
            "ai", "ei", "ui", "ao", "ou", "iu", "ie", "üe", "ve", "er",  // Compound finals
            "an", "en", "in", "un", "ün", "vn",  // Nasal finals -n
            "ang", "eng", "ing", "ong",  // Nasal finals -ng
            "ia", "iao", "ian", "iang", "iong",  // i- group
            "ua", "uo", "uai", "uan", "uang", "ueng"  // u- group
        ],
        
        // Split pinyin syllable into initial, final, tone
        splitPinyinSyllable(raw) {
            if (!raw) return { initial: '', final: '', tone: 5 };
            
            // ✅ Remove punctuation and special characters
            let cleaned = raw
                .replace(/[.,!?;:。，！？；：…]/g, '')  // Remove punctuation
                .trim()
                .toLowerCase();
            
            if (!cleaned) return { initial: '', final: '', tone: 5 };
            
            // ✅ Detect tone from diacritics (tone marks) first
            const toneMap = {
                'ā': ['a', 1], 'ē': ['e', 1], 'ī': ['i', 1], 'ō': ['o', 1], 'ū': ['u', 1], 'ǖ': ['ü', 1],
                'á': ['a', 2], 'é': ['e', 2], 'í': ['i', 2], 'ó': ['o', 2], 'ú': ['u', 2], 'ǘ': ['ü', 2],
                'ǎ': ['a', 3], 'ě': ['e', 3], 'ǐ': ['i', 3], 'ǒ': ['o', 3], 'ǔ': ['u', 3], 'ǚ': ['ü', 3],
                'à': ['a', 4], 'è': ['e', 4], 'ì': ['i', 4], 'ò': ['o', 4], 'ù': ['u', 4], 'ǜ': ['ü', 4],
            };
            
            let tone = 5; // Default neutral tone
            let normalized = cleaned;
            
            // Replace tone marks with base letters and detect tone
            for (const [marked, [base, toneNum]] of Object.entries(toneMap)) {
                if (cleaned.includes(marked)) {
                    normalized = cleaned.replace(marked, base);
                    tone = toneNum;
                    break;
                }
            }
            
            // Extract tone from number suffix if present (overrides tone mark)
            const toneMatch = normalized.match(/(\d)$/);
            if (toneMatch) {
                tone = Number(toneMatch[1]);
                normalized = normalized.slice(0, -1);
            }
            
            const core = normalized;
            if (!core) return { initial: '', final: '', tone };
            
            // Find initial (longest match first)
            const initial = this.INITIALS.find(ini => core.startsWith(ini)) || '';
            let final = core.slice(initial.length);
            
            // ✅ CRITICAL: Validate final - must be in VALID_FINALS list
            // Replace 'v' with 'ü' for comparison
            final = final.replace(/v/g, 'ü');
            
            if (final && !this.VALID_FINALS.includes(final)) {
                // Invalid final - try without initial (zero-initial syllable)
                if (!initial) {
                    console.warn(`Invalid final detected: "${final}" in syllable "${raw}"`);
                    return { initial: '', final: '', tone: 5 }; // Skip invalid syllable
                }
                // Maybe entire core is the final (zero initial)?
                if (this.VALID_FINALS.includes(core)) {
                    return { initial: '', final: core, tone };
                }
                console.warn(`Invalid syllable: "${raw}" - final "${final}" not in valid list`);
                return { initial: '', final: '', tone: 5 }; // Skip invalid syllable
            }
            
            return { initial, final, tone };
        },
        
        // Build syllable stats from pinyin and words
        buildSyllableStats(pinyinRef, words) {
            if (!pinyinRef) return [];
            
            const syllables = pinyinRef
                .trim()
                .split(/\s+/)
                .filter(Boolean);
            
            const stats = [];
            const len = Math.min(syllables.length, words.length);
            
            for (let i = 0; i < len; i++) {
                const syl = syllables[i];
                const word = words[i];
                const { initial, final, tone } = this.splitPinyinSyllable(syl);
                
                stats.push({
                    syllable: syl,
                    word: word.word,
                    initial,
                    final,
                    tone,
                    accuracy: word.accuracyScore
                });
            }
            
            return stats;
        },
        
        // ==================== LESSON SUMMARY FUNCTIONS ====================
        
        // Aggregate feature statistics (with validation)
        aggregateFeature(syllableStats, field) {
            const map = new Map();
            
            for (const stat of syllableStats) {
                const key = String(stat[field]);
                
                // Skip empty, neutral tone (5), or invalid values
                if (!key || key === '' || key === '5' || key === 'undefined' || key === 'null') continue;
                
                // ✅ Validate initials and finals
                if (field === 'initial') {
                    // Must be in INITIALS list or empty string (zero initial)
                    if (key !== '' && !this.INITIALS.includes(key)) {
                        console.warn(`Skipping invalid initial: "${key}"`);
                        continue;
                    }
                } else if (field === 'final') {
                    // Must be in VALID_FINALS list
                    if (!this.VALID_FINALS.includes(key)) {
                        console.warn(`Skipping invalid final: "${key}"`);
                        continue;
                    }
                }
                
                const item = map.get(key) || { sum: 0, count: 0 };
                item.sum += stat.accuracy;
                item.count += 1;
                map.set(key, item);
            }
            
            return Array.from(map.entries())
                .map(([key, { sum, count }]) => ({
                    key,
                    count,
                    avgAccuracy: Math.round(sum / count)
                }))
                .sort((a, b) => b.avgAccuracy - a.avgAccuracy);
        },
        
        // Pick strength features
        pickStrength(stats, threshold = 85, minCount = 3) {
            return stats
                .filter(s => s.count >= minCount && s.avgAccuracy >= threshold)
                .slice(0, 10); // Top 10
        },
        
        // Pick weakness features
        pickWeakness(stats, threshold = 70, minCount = 3) {
            return stats
                .filter(s => s.count >= minCount && s.avgAccuracy <= threshold)
                .sort((a, b) => a.avgAccuracy - b.avgAccuracy)
                .slice(0, 10); // Bottom 10
        },
        
        // Summarize full lesson
        summarizeLesson(lessonId, sentenceAssessments) {
            const sentenceCount = sentenceAssessments.length || 1;
            
            // Average scores
            const avgPronScore = sentenceAssessments.reduce((s, x) => s + x.pronunciationScore, 0) / sentenceCount;
            const avgAccuracyScore = sentenceAssessments.reduce((s, x) => s + x.accuracyScore, 0) / sentenceCount;
            const avgFluencyScore = sentenceAssessments.reduce((s, x) => s + x.fluencyScore, 0) / sentenceCount;
            const avgCompletenessScore = sentenceAssessments.reduce((s, x) => s + x.completenessScore, 0) / sentenceCount;
            
            const prosodyScores = sentenceAssessments
                .map(s => {
                    let score = s.prosodyScore;
                    // ✅ FIX: Nếu prosodyScore = 0 (câu quá ngắn), dùng pronunciationScore làm fallback
                    if ((!score || score === 0) && s.pronunciationScore > 0) {
                        score = s.pronunciationScore;
                    }
                    return score;
                })
                .filter(x => typeof x === 'number' && x > 0);
            const avgProsodyScore = prosodyScores.length > 0
                ? prosodyScores.reduce((s, x) => s + x, 0) / prosodyScores.length
                : 0;
            
            // Aggregate all syllables
            const allSyllables = sentenceAssessments.flatMap(s => s.syllableStats || []);
            
            const initials = this.aggregateFeature(allSyllables, 'initial');
            const finals = this.aggregateFeature(allSyllables, 'final');
            const tones = this.aggregateFeature(allSyllables.map(s => ({ ...s, tone: `${s.tone}` })), 'tone');
            
            // ✅ Calculate average tone score with fallback
            let avgToneScore = 0;
            if (tones.length > 0) {
                avgToneScore = Math.round(tones.reduce((sum, t) => sum + t.avgAccuracy, 0) / tones.length);
            }
            // Fallback: If no valid tone data or score is 0, use pronunciation score
            if (avgToneScore === 0 && avgPronScore > 0) {
                avgToneScore = Math.round(avgPronScore);
            }
            
            // Pick strength/weakness
            const strengthInitials = this.pickStrength(initials, 85, 1);  // ✅ 85+ = good, minCount=1
            const weaknessInitials = this.pickWeakness(initials, 70, 1);  // ✅ <=70 = bad, minCount=1
            const strengthFinals = this.pickStrength(finals, 85, 1);
            const weaknessFinals = this.pickWeakness(finals, 70, 1);
            const strengthTones = this.pickStrength(tones, 85, 1);
            const weaknessTones = this.pickWeakness(tones, 70, 1);
            // ✅ Calculate OVERALL score as weighted average of 4 aspects
            // Formula: (Accuracy * 0.35) + (Fluency * 0.25) + (Tone * 0.25) + (Completeness * 0.15)
            const overallScore = Math.round(
                (avgAccuracyScore * 0.35) +
                (avgFluencyScore * 0.25) +
                (avgToneScore * 0.25) +
                (avgCompletenessScore * 0.15)
            );
            
            return {
                lessonId,
                sentenceCount,
                avgPronScore: Math.round(avgPronScore),
                avgAccuracyScore: Math.round(avgAccuracyScore),
                avgFluencyScore: Math.round(avgFluencyScore),
                avgCompletenessScore: Math.round(avgCompletenessScore),
                avgProsodyScore: Math.round(avgProsodyScore),
                avgToneScore,  // ✅ Add tone score
                overallScore,  // ✅ NEW: Overall weighted score
                initials,
                finals,
                tones,
                strengthInitials,
                weaknessInitials,
                strengthFinals,
                weaknessFinals,
                strengthTones,
                weaknessTones,
                allSyllables // For detailed analysis
            };
        },

        // Fallback to browser TTS
        fallbackTTS(text) {
            return new Promise((resolve, reject) => {
                try {
                    if (!window.speechSynthesis) {
                        resolve();
                        return;
                    }

                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 1.0;
                    
                    const voices = speechSynthesis.getVoices();
                    const zhVoice = voices.find(v => /zh|chinese/i.test(v.lang + ' ' + v.name));
                    if (zhVoice) {
                        utterance.voice = zhVoice;
                    }

                    utterance.onend = resolve;
                    utterance.onerror = resolve;
                    
                    speechSynthesis.cancel();
                    speechSynthesis.speak(utterance);
                } catch (e) {
                    resolve();
                }
            });
        },

        // Escape XML characters
        escapeXml(unsafe) {
            return unsafe.replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }
    };

    window.showPopup = window.showPopup;
    window.AzureSpeech = window.AzureSpeech;

function rtgIsMandarinVoice(v) {
  const lang = (v.lang || '').toLowerCase();

// ==================== GRAMMAR MODULE CODE ====================

// React hooks already declared in main app, no need to redeclare
// const { useState, useEffect, useMemo, useCallback, useRef } = React; // REMOVED - duplicate declaration

        // ==================== STORAGE ====================
        const StorageKeys = {
            GRAMMAR_DATA: 'RTG_GRAMMAR_DATA_V2',
            GRAMMAR_PROGRESS: 'RTG_GRAMMAR_PROGRESS_V2',
            GRAMMAR_LAST_LEVEL: 'RTG_GRAMMAR_LAST_LEVEL'
        };

        const storage = {
            get: (key, defaultValue = null) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    return defaultValue;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (e) {
                    return false;
                }
            }
        };

        // ==================== DATA HOOKS ====================
        const useGrammarData = () => {
            const [data, setData] = useState(() => storage.get(StorageKeys.GRAMMAR_DATA, {}));
            const [refreshKey, setRefreshKey] = useState(0);

            const saveData = useCallback((newData) => {
                storage.set(StorageKeys.GRAMMAR_DATA, newData);
                setData(newData);
                setRefreshKey(prev => prev + 1);
            }, []);

            const getGrammarByLevel = useCallback((level) => {
                if (level === 7) {
                    return [
                        ...(data[7] || []),
                        ...(data[8] || []),
                        ...(data[9] || [])
                    ];
                }
                return data[level] || [];
            }, [data]);

            const addOrUpdateGrammar = useCallback((level, grammarPoint) => {
                const currentData = storage.get(StorageKeys.GRAMMAR_DATA, {});
                const levelData = currentData[level] || [];
                const existingIndex = levelData.findIndex(g => g.name === grammarPoint.name);

                let newLevelData;
                if (existingIndex >= 0) {
                    newLevelData = [...levelData];
                    newLevelData[existingIndex] = grammarPoint;
                } else {
                    newLevelData = [...levelData, grammarPoint];
                }

                const newData = { ...currentData, [level]: newLevelData };
                saveData(newData);
            }, [saveData]);

            const deleteGrammar = useCallback((level, grammarName) => {
                const currentData = storage.get(StorageKeys.GRAMMAR_DATA, {});
                const levelData = currentData[level] || [];
                const newLevelData = levelData.filter(g => g.name !== grammarName);
                const newData = { ...currentData, [level]: newLevelData };
                saveData(newData);
            }, [saveData]);

            const importFromExcel = useCallback((excelData, level, mode = 'merge') => {
                const currentData = storage.get(StorageKeys.GRAMMAR_DATA, {});
                const newData = { ...currentData };

                if (mode === 'overwrite') {
                    newData[level] = excelData;
                } else {
                    const existing = newData[level] || [];
                    const merged = [...existing];

                    excelData.forEach(newGrammar => {
                        const existingIndex = merged.findIndex(g => g.name === newGrammar.name);
                        if (existingIndex >= 0) {
                            merged[existingIndex] = newGrammar;
                        } else {
                            merged.push(newGrammar);
                        }
                    });

                    newData[level] = merged;
                }

                saveData(newData);
            }, [saveData]);

            return {
                data,
                getGrammarByLevel,
                addOrUpdateGrammar,
                deleteGrammar,
                importFromExcel,
                saveData,
                refreshKey
            };
        };

        const useGrammarProgress = () => {
            const [progress, setProgress] = useState(() => storage.get(StorageKeys.GRAMMAR_PROGRESS, {}));

            const saveProgress = useCallback((newProgress) => {
                storage.set(StorageKeys.GRAMMAR_PROGRESS, newProgress);
                setProgress(newProgress);
            }, []);

            const recordAttempt = useCallback((structureKey, isCorrect) => {
                const currentProgress = storage.get(StorageKeys.GRAMMAR_PROGRESS, {});
                const structureProgress = currentProgress[structureKey] || {
                    attempted: 0,
                    correct: 0,
                    lastPracticed: null
                };

                const newStructureProgress = {
                    attempted: structureProgress.attempted + 1,
                    correct: structureProgress.correct + (isCorrect ? 1 : 0),
                    lastPracticed: new Date().toISOString()
                };

                const newProgress = {
                    ...currentProgress,
                    [structureKey]: newStructureProgress
                };

                saveProgress(newProgress);
            }, [saveProgress]);

            const getProgress = useCallback((structureKey) => {
                return progress[structureKey] || {
                    attempted: 0,
                    correct: 0,
                    lastPracticed: null
                };
            }, [progress]);

            return { progress, recordAttempt, getProgress };
        };

        const useCustomDialog = () => {

        // ==================== CHUNK SPLITTER ====================

        const PRONOUNS = ['我', '你', '他', '她', '它', '我们', '你们', '他们', '她们'];
        const SUBJECT_SUFFIXES = [
            '爸爸', '妈妈', '老师', '同学', '同事', '朋友', '孩子', '同屋', '同事们', '同学们',
            '同桌', '师傅', '同伴', '哥哥', '姐姐', '弟弟', '妹妹', '爷爷', '奶奶'
        ];
        const DEGREE_ADVERBS = ['很', '非常', '挺', '特别', '太', '真', '相当', '更加'];

        /**
         * Tinh chỉnh một mảnh câu: ưu tiên tách cấu trúc kiểu
         *   [主语] + [动词] + [程度副词+形容词]
         * Ví dụ: "我爸爸工作特别忙" -> ["我爸爸", "工作", "特别忙"]
         */
        const refineChunk = (chunk) => {
            const result = [];
            let seg = (chunk || '').trim();

            if (!seg) return result;
            if (seg.length <= 2) {
                // Mảnh quá ngắn thì giữ nguyên
                result.push(seg);
                return result;
            }

            // 1) Tìm mức độ phó từ (特别, 非常, 很, 太...)
            let advIndex = -1;
            let advWord = '';
            for (const adv of DEGREE_ADVERBS) {
                const idx = seg.indexOf(adv);
                if (idx > 0) { // chỉ cắt khi phía trước còn nội dung
                    advIndex = idx;
                    advWord = adv;
                    break;
                }
            }

            // Không có mức độ phó từ hoặc phó từ đứng đầu -> giữ nguyên
            if (advIndex <= 0) {
                result.push(seg);
                return result;
            }

            // 2) Có mức độ phó từ: thử tách chủ ngữ + phần còn lại
            let subject = null;

            for (const pron of PRONOUNS) {
                if (seg.startsWith(pron)) {
                    for (const suffix of SUBJECT_SUFFIXES) {
                        const candidate = pron + suffix;
                        if (seg.startsWith(candidate)) {
                            subject = candidate;
                            break;
                        }
                    }
                }
                if (subject) break;
            }

            const beforeAdv = seg.slice(0, advIndex).trim();   // ví dụ "我爸爸工作"
            const afterAdv = seg.slice(advIndex).trim();       // ví dụ "特别忙"

            if (subject) {
                result.push(subject); // "我爸爸"
                const verbPart = beforeAdv.slice(subject.length).trim(); // "工作"
                if (verbPart) result.push(verbPart);
            } else {
                if (beforeAdv) result.push(beforeAdv);
            }

            if (afterAdv) result.push(afterAdv);

            return result;
        };

        /**
         * Tách câu tiếng Trung thành các cụm nhỏ để kéo thả.
         * - Luôn tách rõ dấu câu, liên từ (即使, 虽然, 因为, 所以...)
         * - Sau đó tinh chỉnh từng mảnh bằng refineChunk ở trên.
         */

        const splitSentenceToChunks = (sentence) => {
            if (!sentence) return [];

            // FIX: Giữ nguyên câu gốc, KHÔNG xóa dấu câu cuối cùng để đảm bảo chính xác 100% khi so sánh
            const cleanSentence = sentence; 

            // Extended grammar markers and common words for better chunking
            const grammarMarkers = [
                '即使', '虽然', '因为', '所以', '只要', '还是', '既然', '不但', '而且', 
                '无论', '都', '如果', '那么', '要是', '就是', '不仅', '或者', '并且', 
                '可是', '但是', '然而', '不过', '虽', '但', '却', '然', '而', '则', 
                '与其', '宁可', '哪怕', '尽管', '即便', '纵然', '假如', '倘若', '除非', '比'
            ];

            const timeLocationWords = [
                '星期天', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六',
                '昨天', '今天', '明天', '后天', '前天', '上午', '下午', '晚上',
                '早上', '中午', '夜里', '去年', '今年', '明年', '现在', '将来',
                '过去', '最近', '以前', '以后', '之前', '之后', '当时', '那时', '平时'
            ];

            const modalVerbs = ['会', '能', '可以', '应该', '必须', '想', '要', '得', '该', '愿意', '敢'];
            const negations = ['不', '没', '别', '未', '非'];
            const aspectMarkers = ['了', '着', '过'];
            
            const commonVerbs = [
                '是', '有', '在', '给', '让', '到', '去', '来', '做', '说', '看', '听',
                '吃', '喝', '买', '卖', '走', '跑', '坐', '站', '睡', '起', '开', '关',
                '用', '拿', '放', '写', '读', '学', '教', '问', '答', '知道', '认识',
                '觉得', '想', '希望', '喜欢', '爱', '需要', '处理', '解决', '生病'
            ];

            const degreeAdverbs = ['很', '非常', '挺', '特别', '太', '真', '相当', '更', '更加', '最', '比较'];

            const rawChunks = [];
            let currentChunk = '';
            let i = 0;

            while (i < cleanSentence.length) {
                const ch = cleanSentence[i];

                // 1) Punctuation -> ATTACH TO CURRENT CHUNK AND SPLIT
                // Dấu câu sẽ được dính vào từ đứng trước nó (Ví dụ: "好" + "。" -> "好。")
                if ('，。！？；：、'.includes(ch)) {
                    currentChunk += ch;
                    if (currentChunk.trim()) {
                        rawChunks.push(currentChunk.trim());
                        currentChunk = '';
                    }
                    i += 1;
                    continue;
                }

                let matched = false;

                // 2) Grammar markers
                for (const marker of grammarMarkers) {
                    if (!marker) continue;
                    const slice = cleanSentence.substring(i, i + marker.length);
                    if (slice === marker) {
                        if (currentChunk.trim()) {
                            rawChunks.push(currentChunk.trim());
                            currentChunk = '';
                        }
                        rawChunks.push(marker);
                        i += marker.length;
                        matched = true;
                        break;
                    }
                }
                if (matched) continue;

                // 3) Time/location words
                for (const word of timeLocationWords) {
                    if (!word) continue;
                    const slice = cleanSentence.substring(i, i + word.length);
                    if (slice === word) {
                        if (currentChunk.trim()) {
                            rawChunks.push(currentChunk.trim());
                            currentChunk = '';
                        }
                        rawChunks.push(word);
                        i += word.length;
                        matched = true;
                        break;
                    }
                }
                if (matched) continue;

                // 4) Common verbs
                for (const verb of commonVerbs) {
                    if (!verb) continue;
                    const slice = cleanSentence.substring(i, i + verb.length);
                    const nextChar = cleanSentence[i + verb.length] || '';
                    
                    if (slice === verb && (
                        '时'.includes(nextChar) || 
                        timeLocationWords.some(w => cleanSentence.substring(i + verb.length).startsWith(w)) ||
                        grammarMarkers.some(m => cleanSentence.substring(i + verb.length).startsWith(m))
                    )) {
                        if (currentChunk.trim()) {
                            rawChunks.push(currentChunk.trim());
                            currentChunk = '';
                        }
                        rawChunks.push(verb);
                        i += verb.length;
                        matched = true;
                        break;
                    }
                }
                if (matched) continue;

                // 5) Skip whitespace
                if (ch === ' ') {
                    if (currentChunk.trim()) {
                        rawChunks.push(currentChunk.trim());
                        currentChunk = '';
                    }
                    i += 1;
                    continue;
                }

                // 6) Accumulate character
                currentChunk += ch;
                i += 1;

                // 7) Smart splitting logic
                if (currentChunk.length >= 2) {
                    let shouldSplit = false;
                    const nextChar = cleanSentence[i] || '';
                    const lookAhead2 = cleanSentence.substring(i, i + 2);
                    const lookAhead3 = cleanSentence.substring(i, i + 3);

                    if (modalVerbs.includes(nextChar) || 
                        negations.includes(nextChar) || 
                        aspectMarkers.includes(nextChar) ||
                        degreeAdverbs.includes(lookAhead2)) {
                        shouldSplit = true;
                    }

                    if (!shouldSplit) {
                        for (const marker of grammarMarkers) {
                            if (marker && (lookAhead2.startsWith(marker) || lookAhead3.startsWith(marker))) {
                                shouldSplit = true;
                                break;
                            }
                        }
                    }

                    // Kiểm tra thêm: Không split nếu ký tự tiếp theo là dấu câu
                    const isNextPunctuation = '，。！？；：、'.includes(nextChar);

                    if (!isNextPunctuation) {
                        if (currentChunk.length >= 4 && (i >= cleanSentence.length || shouldSplit)) {
                            if (currentChunk.trim()) {
                                rawChunks.push(currentChunk.trim());
                                currentChunk = '';
                            }
                        } else if (shouldSplit && currentChunk.length >= 3) {
                            if (currentChunk.trim()) {
                                rawChunks.push(currentChunk.trim());
                                currentChunk = '';
                            }
                        }
                    }
                }
            }

            if (currentChunk.trim()) {
                rawChunks.push(currentChunk.trim());
            }

            // 8) Refine chunks
            const finalChunks = [];
            for (let idx = 0; idx < rawChunks.length; idx++) {
                const current = rawChunks[idx].trim();
                if (!current) continue;

                // Nếu chunk chỉ là dấu câu (trường hợp hiếm), gộp vào chunk trước
                if (current.length === 1 && '，。！？；：、'.includes(current)) {
                    if (finalChunks.length > 0) {
                        finalChunks[finalChunks.length - 1] += current;
                    } else {
                        finalChunks.push(current);
                    }
                    continue;
                }

                if ((current.length >= 2 && current.length <= 6) || /[，。！？；：、]/.test(current)) {
                    finalChunks.push(current);
                    continue;
                }

                if (current.length === 1 && idx + 1 < rawChunks.length) {
                    const next = rawChunks[idx + 1].trim();
                    if (next && !grammarMarkers.includes(next) && !timeLocationWords.includes(next)) {
                        rawChunks[idx + 1] = current + next;
                        continue;
                    }
                }

                if (current.length > 6) {
                    const refined = refineChunk(current);
                    if (refined && refined.length > 0) {
                        for (const c of refined) {
                            if (c && c.trim()) finalChunks.push(c.trim());
                        }
                    } else {
                        finalChunks.push(current);
                    }
                } else {
                    finalChunks.push(current);
                }
            }

            return finalChunks;
        };

        // ==================== GRAMMAR POINT LIST ====================
        const GrammarPointList = ({ level, grammarPoints, onSelect, onBack, refreshKey }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            const filteredGrammar = useMemo(() => {
                if (!grammarPoints) return [];
                if (!searchTerm) return grammarPoints;
                const term = searchTerm.toLowerCase();
                return grammarPoints.filter(g =>
                    g.name.toLowerCase().includes(term)
                );
            }, [grammarPoints, searchTerm, refreshKey]);

            return (
                <div className="glass" style={{ padding: '32px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                            <span style={{ fontSize: '28px' }}>📖</span>
                            <h2 style={{ fontSize: '24px', fontWeight: '700', margin: 0 }}>

                    </button>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>

                                <p style={{ fontSize: '14px' }}>Vui lòng import dữ liệu từ Excel hoặc thêm thủ công</p>
