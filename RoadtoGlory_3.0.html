const TimerBubble = React.memo(function TimerBubble({ onShow }){
  const [bubblePos, setBubblePos] = React.useState(() => {
    const size = 36; const pad = 8;
    const clamp = (x, y) => {
      const maxX = window.innerWidth - size - pad;
      const maxY = window.innerHeight - size - pad;
      return { x: Math.max(pad, Math.min(maxX, x)), y: Math.max(pad, Math.min(maxY, y)) };
    };
    try{
      const raw = localStorage.getItem('rtg_timer_bubble_pos');
      if(raw){ const p = JSON.parse(raw); if(typeof p.x==='number' && typeof p.y==='number') return clamp(p.x, p.y); }
    }catch(e){}
    return clamp(window.innerWidth - 140, window.innerHeight - 120);
  });
  const bubRef = React.useRef(null);
  React.useEffect(() => {
    try{ localStorage.setItem('rtg_timer_bubble_pos', JSON.stringify(bubblePos)); }catch(e){}
  }, [bubblePos]);
  /*RESIZE_CLAMP_ADDED*/
  React.useEffect(() => {
    const onResize = () => {
      const size = 36, pad = 8;
      const maxX = window.innerWidth - size - pad;
      const maxY = window.innerHeight - size - pad;
      const nx = Math.max(pad, Math.min(maxX, bubblePos.x));
      const ny = Math.max(pad, Math.min(maxY, bubblePos.y));
      if (nx !== bubblePos.x || ny !== bubblePos.y) setBubblePos({ x: nx, y: ny });
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [bubblePos]);

  const onDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const el = bubRef.current;
    if(!el) return;
    const rect = el.getBoundingClientRect();
    const startX = e.clientX; const startY = e.clientY;
    const origX = rect.left; const origY = rect.top;
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      let nx = origX + dx;
      let ny = origY + dy;
      const pad = 8;
      const w = el.offsetWidth, h = el.offsetHeight;
      const maxX = window.innerWidth - w - pad;
      const maxY = window.innerHeight - h - pad;
      if (nx < pad) nx = pad;
      if (ny < pad) ny = pad;
      if (nx > maxX) nx = maxX;
      if (ny > maxY) ny = maxY;
      setBubblePos({ x: nx, y: ny });
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      try{ localStorage.setItem('rtg_timer_bubble_pos', JSON.stringify(bubblePos)); }catch(e){}
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  const handleShow = (e) => {
    e?.preventDefault?.(); e?.stopPropagation?.();
    try{ localStorage.setItem('rtg_timer_widget_visible','1'); }catch(e){}
    try{ document.dispatchEvent(new CustomEvent('rtg:timer-visibility-toggle')); }catch(e){}
    try{ window.__RTG_TOGGLE_TIMER_WIDGET?.(true); }catch(e){}
    try{ onShow?.(); }catch(e){}
  };

  return (
    <div className="fixed inset-0 pointer-events-none z-[2147483000]">
      <div ref={bubRef} className="absolute pointer-events-auto select-none" style={{ left: bubblePos.x + 'px', top: bubblePos.y + 'px' }}>
        <button
          onMouseDown={onDown}
          onClick={handleShow}
          className="px-3 py-2 rounded-full bg-emerald-600 text-white shadow-lg hover:brightness-95 active:scale-95"
          title="Hiện đồng hồ"
        >
          ⏱️
        </button>
      </div>
    </div>
  );
});

window.StudyTimerWidget = ({ setMessage }) => {

    try { return localStorage.getItem('rtg_timer_widget_visible') !== '0'; } catch(e) { return true; }
  });

      } catch(e){}

    document.addEventListener('rtg:timer-visibility-toggle', sync);
    window.addEventListener('storage', onStorage);
    return () => {
      document.removeEventListener('rtg:timer-visibility-toggle', sync);

    try { window.__RTG_TOGGLE_TIMER_WIDGET?.(false); } catch(e){}

  }, []);

};

            function handleStartReviewFromModal() {
                const limit = parseInt(tempReviewLimit, 10);
                let actualLimit = limit;
                const { isVisible, isDifficult } = showReviewLimitModal;

                let vocabForReview = [];
                if (isDifficult) {
                    vocabForReview = allVocabularies.filter(vocab => vocab.wrongAttempts && vocab.wrongAttempts >= 2);
                    if (vocabForReview.length === 0) {
                        setMessage({ text: "Chưa có từ vựng khó nào để ôn tập. Hãy thử làm sai một vài lần!", type: "info" });
                        setShowReviewLimitModal({ isVisible: false, isDifficult: false });
                        return;
                    }
                } else if (reviewMode === 'allLessons') {
                    vocabForReview = allVocabularies;
                } else if (reviewMode === 'singleLesson' && selectedLesson) {
                    vocabForReview = allVocabularies.filter(v => v.lessonId === selectedLesson.id);
                } else if (reviewMode === 'singleCourse' && selectedCourse) {
                    const courseLessonIds = lessons.filter(l => l.courseId === selectedCourse.id).map(l => l.id);
                    vocabForReview = allVocabularies.filter(v => courseLessonIds.includes(v.lessonId));
                    // removed stray filter that referenced selectedLesson when reviewing a course
                }

                // Build a permissive pool; we'll validate per-question when generating items
                if (!Array.isArray(vocabForReview) || vocabForReview.length === 0) { vocabForReview = allVocabularies; }
                let validVocabForReview = vocabForReview.filter(v => v && v.hanTu);
                if (validVocabForReview.length === 0) {
                    validVocabForReview = [...vocabForReview];
                }
                
                // Ưu tiên từ có masteryScore thấp, nhưng vẫn có yếu tố ngẫu nhiên
                const sortedByMastery = [...validVocabForReview].sort((a, b) => {
                    const scoreA = a.masteryScore || 0;
                    const scoreB = b.masteryScore || 0;
                    // Từ có điểm thấp hơn sẽ được ưu tiên
                    if (scoreA !== scoreB) return scoreA - scoreB;
                    // Nếu điểm bằng nhau, thêm một chút random
                    return Math.random() - 0.5;
                });
                
                setReviewSourceVocabs(sortedByMastery);

                if (isNaN(actualLimit) || actualLimit <= 0) {
                    actualLimit = validVocabForReview.length;
                }
                
                let questionsToAsk = [];
                // Lấy từ có điểm thấp nhất trước
                const poolSize = Math.min(actualLimit * 3, sortedByMastery.length); // Tạo pool lớn hơn một chút
                let currentPool = sortedByMastery.slice(0, poolSize);
                
                for (let i = 0; i < actualLimit; i++) {
                    if (currentPool.length > 0) {
                        // Chọn từ pool với xác suất nghiêng về từ có điểm thấp
                        // 70% chọn từ trong top 30%, 30% chọn random từ phần còn lại
                        const topThird = Math.ceil(currentPool.length * 0.3);
                        const selectedIndex = Math.random() < 0.7 
                            ? Math.floor(Math.random() * topThird)
                            : Math.floor(Math.random() * currentPool.length);
                        
                        questionsToAsk.push(currentPool[selectedIndex]);
                        currentPool.splice(selectedIndex, 1);
                    } else {
                        // RTG QCOUNT FIX2: pool exhausted but need more -> refill from base to allow duplicates
                        if (Array.isArray(sortedByMastery) && sortedByMastery.length > 0) {
                            currentPool = sortedByMastery.slice(); // refill for sampling with replacement
                            i--; // redo this iteration
                            continue;
                        } else {
                            break;
                        }
                    }
                }
                
                setReviewVocabList(questionsToAsk);
                setTotalQuestions(questionsToAsk.length);
                setScore(0);
                setCurrentQuestionNumber(0);
                setReviewStartTime(Date.now()); // Bắt đầu đếm thời gian
                displayQuestion(0, questionsToAsk);
                setView('review');
                setShowReviewLimitModal({ isVisible: false, isDifficult: false });
                
                // === RTG QCOUNT FIX ===
                // If user requested more questions than pool size, duplicate from picked set to reach actualLimit
                if (Array.isArray(questionsToAsk) && typeof actualLimit !== 'undefined') {
                    const _rtgBaseQ = questionsToAsk.slice();
                    if (_rtgBaseQ.length > 0 && questionsToAsk.length < actualLimit) {
                        let _rtg_i = 0;
                        while (questionsToAsk.length < actualLimit) {
                            questionsToAsk.push(_rtgBaseQ[_rtg_i % _rtgBaseQ.length]);
                            _rtg_i++;
                        }
                    }
                }
                // === /RTG QCOUNT FIX ===

                console.log(`Review session started with total questions:`, questionsToAsk.length);
            };

            function handleFlashcardFeedback(level) {
                if (isCorrect !== null) return;
                // Hệ thống điểm mới: 0→-2, 1→-1, 2→+1, 3→+2
                const pointChange = [-2, -1, 1, 2][level];
                const good = level >= 2;
                setIsCorrect(good);
                setFlashcardRevealed(true);
                
                // Tăng score khi trả lời đúng (Đã thuộc hoặc Thành thạo)
                if (good) {
                    setScore(prev => prev + 1);
                }
                
                if (question && question.vocab) {
                    const vocabId = question.vocab.id;
                    setLessons(prevLessons => 
                        prevLessons.map(lesson => ({
                            ...lesson,
                            vocabularies: lesson.vocabularies.map(vocab => {
                                if (vocab.id === vocabId) {
                                    const newMasteryScore = (vocab.masteryScore || 0) + pointChange;
                                    if (good) {
                                        const newCorrectStreak = (vocab.correctStreak || 0) + 1;
                                        return {
                                            ...vocab,
                                            masteryScore: newMasteryScore,
                                            correctStreak: newCorrectStreak,
                                            wrongAttempts: newCorrectStreak >= CORRECT_STREAK_TO_GRADUATE ? 0 : vocab.wrongAttempts
                                        };
                                    } else {
                                        return {
                                            ...vocab,
                                            masteryScore: newMasteryScore,
                                            wrongAttempts: (vocab.wrongAttempts || 0) + 1,
                                            correctStreak: 0
                                        };
                                    }
                                }
                                return vocab;
                            })
                        }))
                    );
                }
                if (question) {
                    playQuestionAudio(question);
                    const newMasteryScore = (question.vocab.masteryScore || 0) + pointChange;
                    setQuestion(prev => prev ? ({ 
                        ...prev, 
                        vocab: { 
                            ...prev.vocab, 
                            masteryScore: newMasteryScore,
                            correctStreak: level >= 2 ? (prev.vocab.correctStreak || 0) + 1 : 0, 
                            wrongAttempts: level >= 2 ? prev.vocab.wrongAttempts : (prev.vocab.wrongAttempts || 0) + 1 
                        } 
                    }) : prev);
                }
            }

            // Function để khôi phục review đã lưu
            async function restoreReviewProgress() {
                try {
                    const savedState = localStorage.getItem('rtg_reviewState');
                    if (!savedState) {
                        console.log("No saved review state found");
                        return;
                    }

                    const reviewState = JSON.parse(savedState);
                    
                    // Kiểm tra xem có phải review gần đây không (< 24h)
                    const isRecent = reviewState.timestamp && (Date.now() - reviewState.timestamp < 24 * 60 * 60 * 1000);
                    
                    if (!isRecent) {
                        console.log("Saved review is too old, clearing it");
                        localStorage.removeItem(REVIEW_PROGRESS_KEY);
                        setSavedReviewProgress(null);
                        return;
                    }

                    // Tìm lesson
                    const lesson = lessons.find(l => l.id === reviewState.selectedLessonId);
                    if (!lesson) {
                        console.log("Lesson not found, clearing saved state");
                        localStorage.removeItem(REVIEW_PROGRESS_KEY);
                        setSavedReviewProgress(null);
                        return;
                    }

                    // Khôi phục vocabulary list từ IDs
                    const vocabList = reviewState.reviewVocabList
                        .map(id => lesson.vocabularies.find(v => v.id === id))
                        .filter(v => v); // Loại bỏ null/undefined
                    
                    if (vocabList.length === 0) {
                        console.log("No vocabularies found, clearing saved state");
                        localStorage.removeItem(REVIEW_PROGRESS_KEY);
                        setSavedReviewProgress(null);
                        return;
                    }

                    console.log("Restoring review session from saved state...");
                    
                    // Khôi phục trạng thái
                    setSelectedLesson(lesson);
                    setReviewVocabList(vocabList);
                    setCurrentQuestionNumber(reviewState.currentQuestionNumber || 0);
                    setScore(reviewState.score || 0);
                    setTotalQuestions(reviewState.totalQuestions || vocabList.length);
                    setReviewStartTime(reviewState.reviewStartTime || Date.now());
                    setReviewSourceVocabs(vocabList);
                    
                    // Hiển thị câu hỏi hiện tại - tăng timeout để đảm bảo state sync
                    setTimeout(() => {
                        displayQuestion(reviewState.currentQuestionNumber || 0, vocabList);
                        setView('review');
                        console.log("Manual restore completed successfully");
                    }, 1000); // Tăng từ 500ms lên 1000ms
                    
                } catch (e) {
                    console.error("Failed to restore review state:", e);
                    localStorage.removeItem(REVIEW_PROGRESS_KEY);
                    setSavedReviewProgress(null);
                }
            }

    function handleNextQuestion() {
                const nextQuestionIndex = currentQuestionNumber + 1;
                if (nextQuestionIndex < totalQuestions) {
                    setCurrentQuestionNumber(nextQuestionIndex);
                    displayQuestion(nextQuestionIndex, reviewVocabList);
                    console.log("Moving to next question:", nextQuestionIndex);
                } else {
                    // Lưu kết quả ôn tập
                    const percentage = totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0;
                    let rating = 'Yếu';
                    if (percentage >= 95) rating = 'Xuất sắc';
                    else if (percentage >= 80) rating = 'Giỏi';
                    else if (percentage >= 65) rating = 'Khá';
                    else if (percentage >= 50) rating = 'Trung bình';
                    
                    // Tính thời gian thực
                    const elapsedMs = reviewStartTime ? (Date.now() - reviewStartTime) : 0;
                    const totalSeconds = Math.floor(elapsedMs / 1000);
                    const minutes = Math.floor(totalSeconds / 60);
                    const seconds = totalSeconds % 60;
                    const formattedTime = `${minutes}p${seconds}s`;
                    
                    // Chọn ngẫu nhiên 1 quote động lực
                    const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                    setMotivationalQuote(randomQuote);
                    
                    setReviewResult({
                        lessonName: selectedLesson?.name || 'Bài học',
                        score,
                        totalQuestions,
                        percentage,
                        rating,
                        duration: formattedTime,
                        timestamp: Date.now()
                    });
                    // Không chuyển view, chỉ hiển thị modal kết quả
                    setView('lessonList');
                    
                    // Xóa saved progress khi hoàn thành
                    try {
                        localStorage.removeItem(REVIEW_PROGRESS_KEY);
                        setSavedReviewProgress(null);
                        console.log("Cleared saved progress after completion");
                    } catch(e) {
                        console.error("Failed to clear progress:", e);

                    setSelectedOption(null);

                            }
                        };
                        reader.readAsText(file);

                        console.error("Error reading import file:", e);

                        setIsProcessing(false);
                        if (e.target) e.target.value = '';
                    }
                } else {
                    if (e.target) e.target.value = '';
                }
            };

            // NEW: Handle Import from HTML File
            async function handleImportFromHtmlFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = (file.text ? await file.text() : await new Response(file).text());
    const doc = new DOMParser().parseFromString(text, 'text/html');

    // ===== Parse DOM only (không cần emoji), nhận cả .vocab-item và article/card =====
    const vocabs = [];
    const seen = new Set();

    const getText = (el) => (el && (el.textContent || '')).trim();
    const isCJK = (s) => /[\u3400-\u9FFF]/.test(s||'');

    // 1) Dạng cũ: .vocab-item
    Array.from(doc.querySelectorAll('.vocab-item')).forEach((el) => {
      const hanTu = getText(el.querySelector('h2 strong')) || '';
      const pinyin = getText(el.querySelector('.pinyin')).replace(/[()]/g,'') || '';
      const meaning = getText(el.querySelector('.meaning')) || '';

      // Hán Việt
      let hanViet = '';
      const hvEl = el.querySelector('.han-viet, [data-hanviet]');
      if (hvEl) hanViet = getText(hvEl);
      else {
        const pv = Array.from(el.querySelectorAll('p')).find(p => /Hán\s*Việt/i.test(getText(p)));
        if (pv) {
          const strong = pv.querySelector('b,strong');
          hanViet = (strong ? getText(strong) : getText(pv).replace(/.*Hán\s*Việt\s*[:：]\s*/i,''));
        }
      }

      const examples = Array.from(el.querySelectorAll('.examples li')).map(li => ({
        chinese: getText(li.querySelector('.chinese')),
        vietnamese: getText(li.querySelector('.vietnamese')),
      })).filter(ex => ex.chinese || ex.vietnamese);

      const key = hanTu + '|' + pinyin + '|' + meaning;
      if (hanTu && !seen.has(key)) {
        seen.add(key);
        vocabs.push({ id:`vc_${Date.now()}_${Math.random().toString(36).slice(2,8)}`, hanTu, pinyin, meaning, hanViet, hanVietMeaning: hanViet, examples, level:'normal' });
      }
    });

    // 2) Dạng mới: article/section.card
    Array.from(doc.querySelectorAll('article, section.card, .card')).forEach((el) => {
      const h2 = el.querySelector('h2');
      if (!h2) return;
      let pinyin = getText(h2.querySelector('span')) || '';
      let full = getText(h2);
      let hanTu = full.replace(/^📌\s*/,'').replace(pinyin,'').trim();
      // Nếu h2 không có span pinyin, thử tách pinyin ở cuối
      if (!pinyin) {
        const parts = full.split(/\s+/);
        if (parts.length >= 2) {
          pinyin = parts[parts.length-1];
          hanTu = parts.slice(0, parts.length-1).join(' ');
        }
      }

      // Hán Việt & Nghĩa
      let hanViet = '', meaning = '';
      const paras = Array.from(el.querySelectorAll('p'));
      for (const p of paras) {
        const t = getText(p);
        if (!hanViet && /Hán\s*Việt/i.test(t)) {
          const strong = p.querySelector('b,strong');
          hanViet = strong ? getText(strong) : t.replace(/.*Hán\s*Việt\s*[:：]\s*/i,'').trim();
        }
        if (!meaning && /^Nghĩa\s*[:：]/i.test(t)) {
          meaning = t.replace(/^Nghĩa\s*[:：]\s*/i,'').trim();
        }
      }

      // Ví dụ: gom theo cụm 3 <p> liên tiếp: ZH (có CJK) → Py (latin) → VI (không CJK)
      const examples = [];
      for (let i=0; i<paras.length-2; i++) {
        const a = getText(paras[i]), b = getText(paras[i+1]), c = getText(paras[i+2]);
        if (isCJK(a) && !isCJK(c)) {
          examples.push({ chinese: a, vietnamese: c });
          i += 2;
        }
      }

      const key = hanTu + '|' + pinyin + '|' + meaning;
      if (hanTu && pinyin && !seen.has(key)) {
        seen.add(key);
        vocabs.push({ id:`vc_${Date.now()}_${Math.random().toString(36).slice(2,8)}`, hanTu, pinyin, meaning, hanViet, hanVietMeaning: hanViet, examples, level:'normal' });
      }
    });

    if (!vocabs.length) {
      setMessage?.({ type:'error', text:'Không tìm thấy từ vựng trong file HTML.' });
      return;
    }

    // Hỏi tên bài
    const titleGuess = (doc.querySelector('title')?.textContent || doc.querySelector('h1')?.textContent || file.name.replace(/\.\w+$/, '')).trim();
    const ask = window.prompt('Đặt tên bài học:', titleGuess);
    const lessonName = (ask && ask.trim()) || titleGuess;

    // Chọn khoá (dùng state `courses`, hỏi người dùng chọn số)
    let chosenCourseId = (Array.isArray(courses) && courses[0]) ? courses[0].id : null;
    try {
      if (Array.isArray(courses) && courses.length > 0) {
        const list = courses.map((c,i)=> `${i+1}. ${c.name}`).join('\n');
        const raw = window.prompt(`Đưa bài vào khoá nào?
${list}

Nhập số (1-${courses.length}):`, '1');
        const idx = Math.max(1, Math.min(courses.length, parseInt(raw||'1',10))) - 1;
        chosenCourseId = courses[idx]?.id || chosenCourseId;
      }
    } catch(_e){}
    
    const newLesson = {
      id: Date.now().toString(),
      name: lessonName,
      createdAt: new Date(),     // Date object để toLocaleDateString chạy OK
      courseId: chosenCourseId,
      vocabularies: vocabs
    };

    setLessons(prev => [...prev, newLesson]);
    setMessage?.({ type:'success', text:`Đã nhập ${vocabs.length} từ vào "${lessonName}".` });
  } catch (err) {
    console.error(err);
    setMessage?.({ type:'error', text:`Lỗi đọc/parse HTML: ${err.message}` });
  } finally {
    e.target.value = '';
  }
};

            const calculateDaysRemaining = (dateString) => {
                if (!dateString) {
                    setDaysRemaining(null);
                    return;
                }
                const target = new Date(dateString);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                target.setHours(0, 0, 0, 0);

                const diffTime = target.getTime() - today.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                setDaysRemaining(diffDays);
                localStorage.setItem('chineseTargetDate', dateString);
            };

            function handleTargetDateChange(e) {
                const dateValue = e.target.value;
                setTargetDate(dateValue);
                calculateDaysRemaining(dateValue);

                const result = await window.RTG_checkInToday();

                // Cập nhật state của React từ kết quả trả về
                setCheckInStreak(result.streak);
                setLastCheckInDate(result.last ? new Date(result.last + 'T00:00:00') : null);
                setShieldCount(result.shields);
                setAutoUseShield(result.auto);

                // Cập nhật thông báo cho UI dựa trên trạng thái
                switch (result.status) {
                    case 'ok':
                        setMessage({ text: `Điểm danh thành công! Streak hiện tại: ${result.streak} ngày.`, type: "success" });
                        // Tích luỹ bảo hộ mỗi 30 ngày
                        if (result.streak > 0 && result.streak % 30 === 0) {
                            const newState = window.RTG_STREAK.loadState();
                            newState.shields = (newState.shields || 0) + 1;
                            window.RTG_STREAK.saveState(newState);
                            setShieldCount(newState.shields);
                            setMessage({ text: `Điểm danh thành công! Streak: ${result.streak} ngày. Bạn được +1 lá chắn!`, type: "success" });

                const currentState = window.RTG_STREAK.loadState();

                            if (taskIndex !== -1) {
                                const task = newPlans[todayStr].tasks[taskIndex];
                                const newCompleted = !task.completed;
                                task.completed = newCompleted;
                                
                                // Auto-complete all uncompleted subtasks when marking main task as completed
                                if (newCompleted && task.subtasks && task.subtasks.length > 0) {
                                    task.subtasks.forEach(subtask => {
                                        if (!subtask.completed) {
                                            subtask.completed = true;
                                        }
                                    });
                                }
                                
                                const completed = newPlans[todayStr].tasks.filter(t => t.completed).length;
                                const total = newPlans[todayStr].tasks.length;
                                newPlans[todayStr].completion = total > 0 ? Math.round((completed / total) * 100) : 0;
                                setStudyPlans(newPlans);
                                showStudyPlanPopup(

                    e.target.value = '';
                    return;
                }

                if (!file.type.startsWith('audio/')) {
                    setMessage({ text: "Vui lòng chọn một file âm thanh (MP3).", type: "error" });
                    e.target.value = '';
                    return;
                }

                setPassageSentences(prevSentences =>
                    prevSentences.map((s, i) =>
                        i === index ? { ...s, audioFileBlob: file, audioFileId: null } : s
                    )
                );
                console.log(`Audio file selected for passage sentence ${index}:`, file.name);
            };

            // NEW: Remove Passage Sentence Audio
            async function handleRemovePassageSentenceAudio(index) {
                const audioIdToDelete = passageSentences[index].audioFileId;
                setPassageSentences(prevSentences => {
                    const newSentences = prevSentences.map((s, i) =>
                        i === index ? { ...s, audioFileBlob: null, audioFileId: null } : s
                    );
                    const fileInput = document.getElementById(`passageAudio-${index}`);
                    if (fileInput) {
                        fileInput.value = '';
                    }
                    return newSentences;
                });
                if (audioIdToDelete) {
                    await deleteAudioFile(audioIdToDelete);
                    console.log("Removed passage sentence audio from IndexedDB:", audioIdToDelete);
                }
                console.log(`Audio removed for passage sentence ${index}.`);
            };

            // NEW: Handle passage sentence changes
            function handlePassageSentenceChange(index, field, value) {
                setPassageSentences(prevSentences =>

                    )
                );
            };

            // NEW: Remove sentence row
            async function handleRemovePassageSentence(index) {
                if (passageSentences.length <= 1) {
                    setMessage({ text: "Bài khóa phải có ít nhất một câu.", type: "error" });
                    return;
                }
                if (window.confirm("Bạn có chắc muốn xóa câu này khỏi bài khóa không?")) {
                    const sentenceToRemove = passageSentences[index];
                    if (sentenceToRemove.audioFileId) {

            // NEW: Handle click for word pop-up (Reading Mode) - ADVANCED MATCHING
            function handleWordClickInPassage(event, sentenceText) {
                stopSpeaking();
                setPopupWord(null);
                if (popupRef.current) popupRef.current.style.display = 'none';

                const clickedElement = event.target;
                if (!clickedElement.classList.contains('hanzi-char-span')) return;

                const textContentBefore = Array.from(clickedElement.parentNode.childNodes)
                                            .slice(0, Array.from(clickedElement.parentNode.childNodes).indexOf(clickedElement))
                                            .map(node => node.textContent)
                                            .join('');
                const clickedCharIndexInSentence = textContentBefore.length;

                let bestMatch = null;
                const MAX_WORD_LEN = 4; 

                for (let len = MAX_WORD_LEN; len >= 1; len--) {
                    for (let startOffset = 0; startOffset < len; startOffset++) {
                        const wordStart = clickedCharIndexInSentence - startOffset;
                        if (wordStart < 0) continue; 

                        const wordEnd = wordStart + len;
                        if (wordEnd > sentenceText.length) continue; 

                        const potentialWordHanTu = sentenceText.substring(wordStart, wordEnd);
                        if (!potentialWordHanTu.match(/^[\u4e00-\u9fff\u3400-\u4DBF]+$/)) continue; 

                        const foundVocab = allVocabularies.find(vocab => 
                            normalizeHanTu(vocab.hanTu) === normalizeHanTu(potentialWordHanTu)
                        );

                        if (foundVocab) {
                            bestMatch = foundVocab;
                            break;
                        }
                    }
                    if (bestMatch) break;
                }


                if (bestMatch) {
                    setPopupWord(bestMatch);
                    console.log("Found best match for popup:", bestMatch);
                    if (popupRef.current) {
                        const { clientX, clientY } = event;
                        const popupWidth = 300; 
                        const popupHeight = 250;
                        const mainContent = document.querySelector('.max-w-[calc(100vw-48px)] 2xl:max-w-screen-2xl');
                        const mainContentRect = mainContent ? mainContent.getBoundingClientRect() : { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };

                        let left = clientX + 10;
                        let top = clientY + 10;

                        if (left + popupWidth > mainContentRect.right) {
                            left = clientX - popupWidth - 10;
                            if (left < mainContentRect.left) {
                                left = mainContentRect.right - popupWidth - 10;
                            }
                        }
                        if (top + popupHeight > mainContentRect.bottom) {
                            top = clientY - popupHeight - 10;
                            if (top < mainContentRect.top) {
                                top = mainContentRect.bottom - popupHeight - 10;
                            }
                        }
                        if (left < mainContentRect.left) left = mainContentRect.left + 10;
                        if (top < mainContentRect.top) top = mainContentRect.top + 10;
                        
                        popupRef.current.style.left = `${left}px`;
                        popupRef.current.style.top = `${top}px`;
                        popupRef.current.style.display = 'block';
                    }
                } else {
                    setPopupWord(null);
                    if (popupRef.current) {
                        popupRef.current.style.display = 'none';
                    }
                }
            };

            useEffect(() => {
                function handleClickOutside(event) {
                    if (popupRef.current && !popupRef.current.contains(event.target)) {
                        let isHanziSpanOrPassageText = false;
                        let targetElement = event.target;
                        while(targetElement && targetElement !== document.body) {
                            if (targetElement.classList.contains('hanzi-char-span') || targetElement.classList.contains('passage-sentence-text')) {
                                isHanziSpanOrPassageText = true; 
                                break;
                            }
                            targetElement = targetElement.parentElement;
                        }

                            setPopupWord(null);
                            if (popupRef.current) {
                                popupRef.current.style.display = 'none';
                            }
                        }
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                };
            }, []); 


            const setupFillInBlanks = () => {
                if (!selectedPassage || !selectedPassage.sentences || selectedPassage.sentences.length === 0) return;

                const sentence = selectedPassage.sentences[currentSentenceIndex];
                const hanTuChars = sentence.chinese.split(''); 
                
                const eligibleIndices = hanTuChars
                                        .map((char, idx) => ({ char, idx }))
                                        .filter(item => item.char.match(/[\u4e00-\u9fff\u3400-\u4DBF]/)); 
                
                const maxMissingCount = Math.min(eligibleIndices.length, 3); 
                const missingCount = Math.min(Math.max(1, Math.floor(eligibleIndices.length * 0.25)), maxMissingCount); 
                
                const indicesToMiss = new Set();
                const tempEligibleIndices = [...eligibleIndices];
                while (indicesToMiss.size < missingCount && tempEligibleIndices.length > 0) {
                    const randomIndexInEligible = Math.floor(Math.random() * tempEligibleIndices.length);
                    indicesToMiss.add(tempEligibleIndices[randomIndexInEligible].idx);
                    tempEligibleIndices.splice(randomIndexInEligible, 1);
                }

                const blanks = hanTuChars.map((char, idx) => {
                    if (indicesToMiss.has(idx)) {
                        return { original: char, display: '___', input: '', isMissing: true, isCorrect: null };
                    }
                    return { original: char, display: char, input: char, isMissing: false, isCorrect: null };
                });
                setFillInBlanksWords(blanks);
                setSentenceInput('');
                setIsCorrect(null);
            };

            function handleFillInBlanksInput(e, index) {

                setFillInBlanksWords(prev =>

                );
            };

            async function checkFillInBlanksAnswer() {
                let allCorrect = true;
                let newBlanks = [...fillInBlanksWords];

                newBlanks.forEach(word => {
                    if (word.isMissing) {
                        const isCharCorrect = normalizeHanTu(word.input) === normalizeHanTu(word.original);
                        word.isCorrect = isCharCorrect; 
                        if (!isCharCorrect) allCorrect = false;
                    }
                });
                setFillInBlanksWords(newBlanks);

                if (allCorrect) {
                    setIsCorrect(true);
                    setMessage({ text: "Chính xác!", type: "success" });
                    await speakSentence(selectedPassage.sentences[currentSentenceIndex]);

                                                    }

                                                    // Start recording

                                                        setIsRecording(true);
                                                        setPronunciationResult(null);
                                                        setAudioBlob(null);  // ✅ v2.1.2: Reset audio blob
                                                        
                                                        // Use cached stream (no permission popup after first time)

                                                        const chunks = [];
                                                        mediaRecorder.ondataavailable = (e) => {

                                                                chunks.push(e.data);
                                                            }
                                                        };
                                                        
                                                        mediaRecorder.onstop = async () => {
                                                            console.log('Recording stopped, processing audio...');
                                                            const audioBlob = new Blob(chunks, { type: 'audio/webm' });
                                                            
                                                            // ✅ v2.1.2: Save audio blob for replay
                                                            setAudioBlob(audioBlob);

{showStudyPlanSettings && (
    <div className="study-plan-settings-modal" onClick={() => setShowStudyPlanSettings(false)}>
        <div className="study-plan-settings-content" onClick={(e) => e.stopPropagation()}>
            <div className="study-plan-settings-header">
                <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                    <i className="fas fa-calendar-check" style={{ fontSize: '1.5rem' }}></i>
                    <h2 style={{ fontSize: '1.5rem', fontWeight: '700', margin: 0 }}>Study Plan & Notes</h2>
                </div>
                <button 
                    onClick={() => setShowStudyPlanSettings(false)}
                    style={{
                        background: 'rgba(255, 255, 255, 0.2)',
                        border: 'none',
                        color: 'white',
                        width: '32px',
                        height: '32px',
                        borderRadius: '50%',
                        cursor: 'pointer',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        transition: 'all 0.2s ease'
                    }}
                >
                    <i className="fas fa-times"></i>
                </button>
            </div>
            
            <div className="study-plan-settings-body">
                <div className="study-plan-import-section">
                    <h3 style={{ fontSize: '1.1rem', fontWeight: '600', marginBottom: '1rem', color: '#374151' }}>
                        <i className="fas fa-file-excel" style={{ marginRight: '0.5rem', color: '#10b981' }}></i>
                        Import Study Plan from Excel
                    </h3>
                    <p style={{ fontSize: '0.875rem', color: '#6b7280', marginBottom: '1rem' }}>
                        Nhập file Excel với cột "Ngày" (YYYY-MM-DD) và các cột nhiệm vụ (Task 1-10)
                    </p>
                    
                    <label className="study-plan-import-label">
                        <i className="fas fa-upload" style={{ fontSize: '1.2rem' }}></i>
                        <span>Chọn file Excel</span>
                        <input 
                            type="file" 
                            accept=".xlsx, .xls" 
                            style={{ display: 'none' }}
                            onChange={(e) => {
                                const file = e.target.files[0];
                                if (!file) return;
                                
                                const reader = new FileReader();
                                reader.onload = (event) => {
                                    try {
                                        const data = new Uint8Array(event.target.result);
                                        const workbook = XLSX.read(data, { type: 'array' });
                                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                                        
                                        const newPlans = importMode === 'overwrite' ? {} : { ...studyPlans };
                                        let importedCount = 0;
                                        
                                        jsonData.forEach(row => {
                                            const dateStr = row['Ngày'] || row['Date'];
                                            if (!dateStr) return;
                                            
                                            // Parse date
                                            let parsedDate;
                                            if (typeof dateStr === 'number') {
                                                // Excel date serial number
                                                parsedDate = new Date((dateStr - 25569) * 86400 * 1000);
                                            } else {
                                                parsedDate = new Date(dateStr);
                                            }
                                            
                                            const dateKey = parsedDate.toLocaleDateString('sv-SE');
                                            
                                            if (!newPlans[dateKey]) {
                                                newPlans[dateKey] = { tasks: [], completion: 0 };
                                            }
                                            
                                            // Import tasks from columns
                                            for (let i = 1; i <= 10; i++) {
                                                const taskText = row[`Task ${i}`] || row[`Nhiệm vụ ${i}`] || row[`Task${i}`];
                                                if (taskText && typeof taskText === 'string' && taskText.trim()) {
                                                    newPlans[dateKey].tasks.push({
                                                        id: `task-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                                                        text: taskText.trim(),
                                                        completed: false,
                                                        pinned: false
                                                    });
                                                    importedCount++;
                                                }
                                            }
                                        });
                                        
                                        setStudyPlans(newPlans);
                                        setShowStudyPlanSettings(false);
                                        showStudyPlanPopup(`✅ Đã import ${importedCount} nhiệm vụ từ Excel`, 'success');
                                    } catch (error) {
                                        console.error('Error importing Excel:', error);
                                        alert('Lỗi khi đọc file Excel. Vui lòng kiểm tra định dạng file.');
                                    }
                                };
                                reader.readAsArrayBuffer(file);
                            }}
                        />
                    </label>
                    
                    <div className="study-plan-import-options">
                        <div 
                            className={`study-plan-import-option ${importMode === 'overwrite' ? 'selected' : ''}`}
                            onClick={() => setImportMode('overwrite')}
                        >
                            <div style={{ fontWeight: '600', marginBottom: '0.25rem' }}>🔄 Ghi đè</div>
                            <div style={{ fontSize: '0.75rem', color: '#6b7280' }}>Xóa dữ liệu cũ và thay thế</div>
                        </div>
                        <div 
                            className={`study-plan-import-option ${importMode === 'append' ? 'selected' : ''}`}
                            onClick={() => setImportMode('append')}

                    <p style={{ fontSize: '0.875rem', color: '#6b7280', marginBottom: '1rem' }}>
                        Nhập file Excel với các cột: Grammar Name, Structure, Explain, Chinese, Pinyin, Vietnamese, Note
                    </p>
                    
                    <label className="study-plan-import-label">
                        <i className="fas fa-upload" style={{ fontSize: '1.2rem' }}></i>
                        <span>Chọn file Excel</span>
                        <input 
                            type="file" 
                            accept=".xlsx, .xls" 
                            style={{ display: 'none' }}
                            onChange={(e) => {
                                const file = e.target.files[0];
                                if (!file) return;
                                
                                const reader = new FileReader();
                                reader.onload = (event) => {
                                    try {
                                        const data = new Uint8Array(event.target.result);
                                        const workbook = XLSX.read(data, { type: 'array' });
                                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                                        
                                        // Process grammar data
                                        const grammarMap = {};
                                        jsonData.forEach(row => {
                                            const grammarName = row['Grammar Name'] || row['Tên ngữ pháp'];
                                            const pattern = row['Structure'] || row['Pattern'] || row['Cấu trúc'];
                                            const explain = row['Explain'] || row['Giải thích'] || '';
                                            const chinese = row['Chinese'] || row['Tiếng Trung'] || '';
                                            const pinyin = row['Pinyin'] || row['Phiên âm'] || '';
                                            const vietnamese = row['Vietnamese'] || row['Tiếng Việt'] || '';
                                            const note = row['Note'] || row['Ghi chú'] || '';
                                            
                                            if (!grammarName || !pattern) return;
                                            
                                            if (!grammarMap[grammarName]) {
                                                grammarMap[grammarName] = {
                                                    name: grammarName,
                                                    structures: []
                                                };
                                            }
                                            
                                            let structure = grammarMap[grammarName].structures.find(s => s.pattern === pattern);
                                            if (!structure) {
                                                structure = {
                                                    pattern,
                                                    explain,
                                                    examples: []
                                                };
                                                grammarMap[grammarName].structures.push(structure);
                                            }
                                            
                                            if (chinese) {
                                                structure.examples.push({
                                                    chinese,
                                                    pinyin,
                                                    vietnamese,
                                                    note
                                                });
                                            }
                                        });
                                        
                                        const preview = Object.values(grammarMap);
                                        
                                        // Show preview and import
                                        setGrammarImportPreview(preview);
                                        setShowGrammarImportDialog(true);
                                        
                                    } catch (error) {
                                        console.error('Error importing Grammar Excel:', error);
                                        alert('Lỗi khi đọc file Excel. Vui lòng kiểm tra định dạng file.');
                                    }
                                };
                                reader.readAsArrayBuffer(file);
                            }}
                        />

                                            zIndex: 10,
                                            transition: 'all 0.2s'
                                        }}
                                        title={emoji ? 'Thay đổi cảm xúc' : 'Thả cảm xúc'}

                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    const newEmojis = { ...dayEmojis };
                                                    delete newEmojis[dateStr];
                                                    setDayEmojis(newEmojis);
                                                    setShowEmojiPicker(null);
                                                    showStudyPlanPopup('🗑️ Đã hủy cảm xúc', 'info');
                                                }}
                                                style={{
                                                    border: '2px dashed #d1d5db',
                                                    background: 'white'
                                                }}
                                                title="Hủy cảm xúc"
                                            >
                                                
                                            </button>
                                            {['😄', '😆', '😁', '🫥', '😫', '😭', '🥶'].map(em => (
                                                <button
                                                    key={em}
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        setDayEmojis({ ...dayEmojis, [dateStr]: em });
                                                        setShowEmojiPicker(null);
                                                        showStudyPlanPopup('✅ Đã thả cảm xúc', 'success');
                                                    }}
                                                >
                                                    {em}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        </div>
    );
})()}

            });
            document.dispatchEvent(event);

            const { message, type } = e.detail || {};
            // Trigger React state update via DOM manipulation
            const toastTrigger = document.createElement('div');
            toastTrigger.setAttribute('data-toast-message', message);
            toastTrigger.setAttribute('data-toast-type', type || 'success');
            toastTrigger.style.display = 'none';

<script>
// === UI Overlay v14-r2 (inline, surgical) ===
(function(){
  const $  = (sel, root=document)=> root.querySelector(sel);
  const $$ = (sel, root=document)=> Array.from(root.querySelectorAll(sel));
  let portal = null;

  function closePortal(){ if(portal && portal.parentElement) portal.parentElement.removeChild(portal); portal=null; }
  function openPortal(anchorBtn, builder){
    closePortal();
    const r = anchorBtn.getBoundingClientRect();
    const m = document.createElement('div');
    m.className = 'rtg-portal-menu';
    const left = Math.max(12, Math.min(window.innerWidth - 300, r.right - 280));
    m.style.left = left + 'px'; m.style.top  = (r.bottom + 10) + 'px';
    builder(m); document.body.appendChild(m); portal = m;
    const onDoc = (e)=>{ if(!m.contains(e.target) && e.target!==anchorBtn){ document.removeEventListener('click', onDoc, true); closePortal(); } };
    setTimeout(()=> document.addEventListener('click', onDoc, true), 0);
  }

  function findCardFrom(btn){
    let p = btn;
    for(let i=0;i<8 && p;i++){
      p = p.parentElement;
      if(!p) break;
      const hasTitle = p.querySelector('h3, h2, [class*="font-bold"]');
      if(hasTitle) return p;
    }
    return null;
  }

  function moveMetaToSecondLine(card, row){
    // Find a small element that contains "Tạo lúc"
    const cands = $$('span,small,div', card).filter(el=> el!==row && /Tạo lúc|T\u1ea1o l\u00fac/i.test(el.textContent||''));
    if(cands.length){
      // prefer the shortest text node (likely just the meta string)
      cands.sort((a,b)=> (a.textContent||'').length - (b.textContent||'').length);
      const src = cands[0];
      const text = src.textContent.trim();
      // Hide the original
      src.style.display='none';
      // Add new line under title row
      const meta = document.createElement('div');
      meta.className = 'rtg-meta';
      meta.textContent = text;
      row.after(meta);
      return;
    }
    // Fallback: search text nodes inside row
    const tn = Array.from(row.childNodes).filter(n=> n.nodeType===3 && /Tạo lúc|T\u1ea1o l\u00fac/i.test(n.nodeValue||''));
    if(tn.length){
      const meta = document.createElement('div'); meta.className='rtg-meta';
      meta.textContent = tn.map(n=>n.nodeValue).join(' ').trim();
      tn.forEach(n=> row.removeChild(n));
      row.after(meta);
    }
  }

  function enhanceOnce(){
    $$('button[title="Ôn Tập Bài Học Này"], button[title="Quản Lý Bài Khóa"]').forEach(anchor=>{
      const card = findCardFrom(anchor);
      if(!card) return;

      const btnReview= $('button[title="Ôn Tập Bài Học Này"]', card);
      const btnPass  = $('button[title="Quản Lý Bài Khóa"]', card);
      const btnUp    = $('button[title="Di chuyển lên"]', card);
      const btnDown  = $('button[title="Di chuyển xuống"]', card);
      const btnDel   = $('button[title^="Xóa"], button[title^="Xoá"]', card);
      const btnRename= $('button[title^="Chỉnh Sửa"], button[title^="Sửa"], button[title^="Đổi tên"]', card);
      const btnOpen  = $('button[title*="Mở"], button[title*="Xem"], button i.fa-book-open', card)?.closest('button');

      // Hide only proxied icons (keep your existing card box)
      [btnReview,btnPass,btnUp,btnDown,btnDel,btnRename,btnOpen].filter(Boolean).forEach(el=> el.classList.add('rtg-hide'));

      // Title row
      const title = card.querySelector('h3, h2, [class*="font-bold"]');
      if(!title) return;
      const row = title.parentElement;
      if(!row.__rtg_built){
        row.classList.add('rtg-title-row'); title.classList.add('rtg-title');

        // Meta -> second line
        moveMetaToSecondLine(card, row);

        // Click title to open vocabulary list
        if(btnOpen && !title.__rtg_click){ title.style.cursor='pointer'; title.addEventListener('click', ()=> btnOpen.click()); title.__rtg_click=true; }
      }

      // Right tools
      const spacer=document.createElement('span'); spacer.className='rtg-flex-spacer';
      const tools=document.createElement('span'); tools.className='rtg-tools';

      if(btnReview){ const play=document.createElement('button'); play.className='rtg-iconbtn rtg-iconbtn--primary'; play.title='Ôn tập bài học'; play.innerHTML='<i class="fa-solid fa-play"></i>'; play.addEventListener('click', e=>{ e.stopPropagation(); btnReview.click(); }); tools.appendChild(play); }
      if(btnPass){ const pass=document.createElement('button'); pass.className='rtg-iconbtn rtg-iconbtn--secondary'; pass.title='Ôn bài khóa'; pass.innerHTML='<i class="fa-regular fa-file-alt"></i>'; pass.addEventListener('click', e=>{ e.stopPropagation(); btnPass.click(); }); tools.appendChild(pass); }

      const dots=document.createElement('button'); dots.className='rtg-iconbtn'; dots.title='Tùy chọn'; dots.innerHTML='<i class="fa-solid fa-ellipsis"></i>';
      dots.addEventListener('click', e=>{
        e.stopPropagation();
        openPortal(dots, (menu)=>{
          const addItem=(text, btn)=>{ if(!btn) return; const it=document.createElement('button'); it.className='rtg-menu-item'; it.textContent=text; it.addEventListener('click', ()=>{ btn.click(); closePortal(); }); menu.appendChild(it); };
          addItem('Chỉnh sửa bài học', btnRename);
          addItem('Di chuyển lên', btnUp);
          addItem('Di chuyển xuống', btnDown);
          addItem('Xoá bài học', btnDel);
        });
      });
      tools.appendChild(dots);

      if(!row.__rtg_built){ title.after(spacer); row.appendChild(tools); row.__rtg_built=true; }
      card.__rtg_v14r2 = true;
    });
  }

  // initial & observe
  enhanceOnce();
  const obs=new MutationObserver(()=> enhanceOnce());
  obs.observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePortal(); });
})();
</script>

<!-- RTG PERM v5: Import Bài Khóa (HTML) — no prompt; resolve lesson by saved id + DOM titles; auto-refresh -->
<script>
(function(){
  function nfkc(s){ try{ return (s||'').normalize('NFKC'); }catch(_){ return s||''; } }
  function norm(s){ s = nfkc(s||''); s = s.replace(/[：:]/g,':'); s = s.replace(/\s+/g,' ').trim(); return s; }
  function key(s){ return norm(s).toLowerCase(); }
  function txt(el){ return (el && (el.textContent||'')).replace(/\s+/g,' ').trim(); }
  function hasCJK(s){ return /[\u3400-\u9FFF]/.test(s||''); }
  function getLS(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(_){ return null; } }
  function setLS(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){ } }

  const LS_LESSONS='chineseVocabLessons';
  const RTG_CUR_ID='rtg_currentLessonId';
  const RTG_CUR_NAME='rtg_currentLessonName';

  function isPassagePage(){
    const heads = Array.from(document.querySelectorAll('h1,h2,h3'));
    const hasHeader = heads.some(h => /Bài Khóa của Bài Học/i.test(txt(h)));
    const hasBack = Array.from(document.querySelectorAll('a,button,div')).some(x => /Quay L(ạ|a)i\s+Danh\s+S(á|a)ch\s+B(à|a)i\s+H(ọ|o)c/i.test(txt(x)));
    return hasHeader || hasBack;
  }

  function getDisplayedLessonName(){
    const h2s = Array.from(document.querySelectorAll('h2,h1'));
    for (const h of h2s){
      const t = txt(h);
      if (/Bài Khóa của Bài Học/i.test(t)){
        const span = h.querySelector('span');
        if (span) return norm(txt(span));
        return norm(t.replace(/.*Bài Khóa của Bài Học\s*:\s*/i,''));
      }
    }
    const heads = Array.from(document.querySelectorAll('h1,h2,h3'));
    let best=null, score=-1;
    for (const h of heads){
      const t = txt(h);
      if (!hasCJK(t)) continue;
      const fs = parseFloat((getComputedStyle(h)||{}).fontSize||'0')||0;
      const sc = (t.match(/[\u3400-\u9FFF]/g)||[]).length*10 + fs;
      if (sc>score){ score=sc; best=t; }
    }
    return best ? norm(best) : null;
  }

  function getDisplayedPassageTitles(){
    const titles = new Set();
    const cards = Array.from(document.querySelectorAll('div'));
    cards.forEach(card=>{
      const p = card.querySelector && card.querySelector('p');
      if (p && /^Số câu\s*:/.test(txt(p))){
        const hh = card.querySelector('h3,h2,h4');
        if (hh) titles.add(norm(txt(hh)));
      }
    });
    return Array.from(titles);
  }

  function resolveByDom(){
    const lessons = getLS(LS_LESSONS) || [];
    if (!lessons.length) return null;
    const name = getDisplayedLessonName();
    const shownTitles = getDisplayedPassageTitles();
    const nameKey = key(name||'');

    let cands = lessons.filter(ls => key(ls && ls.name || '') === nameKey);
    if (!cands.length) cands = lessons.filter(ls => key(ls && ls.name || '').includes(nameKey) || nameKey.includes(key(ls && ls.name || '')));
    if (!cands.length) return null;
    if (cands.length === 1) return cands[0].id;

    const shownSet = new Set((shownTitles||[]).map(t => key(t)));
    let best = null, bestScore = -1;
    for (const ls of cands){
      const lsSet = new Set(((ls.passages||[]).map(p => key(p && p.title || ''))).filter(Boolean));
      let inter = 0; shownSet.forEach(t => { if (lsSet.has(t)) inter++; });
      const score = inter*100 - Math.abs(lsSet.size - shownSet.size);
      if (score > bestScore){ bestScore = score; best = ls; }
    }
    return best ? best.id : null;
  }

  function resolveLessonId(){
    const lessons = getLS(LS_LESSONS) || [];
    if (!lessons.length) return null;
    const savedId = getLS(RTG_CUR_ID);
    if (typeof savedId === 'string' && lessons.some(ls => ls && ls.id === savedId)) return savedId;
    const id = resolveByDom();
    if (id){
      const ls = lessons.find(x => x && x.id === id);
      setLS(RTG_CUR_ID, id);
      setLS(RTG_CUR_NAME, ls && ls.name || '');
      return id;
    }
    if (lessons.length === 1) return lessons[0].id;
    return null; // NO PROMPT
  }

  async function doImport(file){
    const html = await file.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const normText = s => (s||'').replace(/\s+/g,' ').trim();
    const out = [];
    doc.querySelectorAll('li').forEach(li=>{
      const zh = normText((li.querySelector('.chinese')||{}).textContent||'');
      if (zh){
        const py = normText((li.querySelector('.pinyin')||{}).textContent||'');
        const vi = normText((li.querySelector('.vietnamese')||{}).textContent||'');
        out.push({ chinese: zh, pinyin: py, vietnamese: vi, speaker: '' });
      }
    });
    if (!out.length){
      const lines = (doc.body.textContent||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
      for (let i=0;i<lines.length;i++){
        const t = lines[i];
        if (/[\u3400-\u9FFF]/.test(t)){
          const zh = t, py = lines[i+1] || '', vi = lines[i+2] || '';
          out.push({ chinese: zh, pinyin: py, vietnamese: vi, speaker: '' }); i+=2;
        }
      }
    }
    if (!out.length){ alert('Không tìm thấy câu tiếng Trung trong file.'); return; }
    const title = normText((doc.querySelector('title,h1,h2,h3')||{}).textContent||'Bài khoá mới');
    const name = prompt('Đặt tên bài khoá', title) || title;

    const lessons = getLS(LS_LESSONS) || [];
    let id = resolveLessonId();
    if (!id) {
      try {
        const opts = (lessons||[]).map((ls,i)=> (i+1)+'. '+(ls&&ls.name||('Bài học '+(i+1)))).join('\n');
        const ans = prompt('Chưa xác định được Bài học hiện tại.\nChọn Bài Học để thêm Bài Khóa:\n'+opts+'\nNhập số thứ tự:');
        const pick = parseInt((ans||'').trim(),10)-1;
        if (!isNaN(pick) && lessons[pick]) id = lessons[pick].id;
      } catch(_){}
    }
    if (!id){ alert('Không thể xác định Bài Học. Hãy mở trang "Bài Khóa của Bài Học" rồi thử lại.'); return; }
    const idx = lessons.findIndex(ls => ls && ls.id === id);
    if (idx < 0){ alert('Không tìm thấy Bài học trong bộ nhớ.'); return; }

    const newPassage = { id: Date.now().toString(), title: name, sentences: out, createdAt: new Date() };
    const cur = lessons[idx];
    cur.passages = Array.isArray(cur.passages) ? cur.passages.concat([newPassage]) : [newPassage];
    lessons[idx] = cur;
    setLS(LS_LESSONS, lessons);
    try { location.reload(); } catch(_){ alert('Đã nhập "'+name+'". Nhấn F5 để thấy.'); }
  }

  function findPlusBtn(){
    const btns = Array.from(document.querySelectorAll('button'));
    let b = btns.find(b => /\+\s*Thêm\s*Bài\s*Kh(óa|oa)\b/i.test(txt(b)));
    if (b) return b;
    b = btns.find(b => b.querySelector('i.fa-plus, i.fas.fa-plus, i.fa-solid.fa-plus') && /B(à|a)i/i.test(txt(b)) && /Kh(óa|oa)/i.test(txt(b)));
    return b || null;
  }

  function ensure(){
    if (!isPassagePage()) return;
    if (document.getElementById('rtg-importPassageBtn')) return;
    const plus = findPlusBtn();
    if (!plus || !plus.parentNode) return;

    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.html,.htm,text/html';
    input.id = 'rtg-importPassageInput'; input.style.display='none';
    input.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (f) doImport(f).catch(err => { console.error(err); alert('Lỗi nhập: '+err.message); });
      e.target.value = '';
    });

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'rtg-importPassageBtn';
    btn.innerHTML = '<i class="fas fa-file-code mr-1"></i> Nhập Bài Khóa (HTML)';
    btn.className = plus.className ? (plus.className + ' ml-2') : 'px-4 py-2 rounded-xl bg-indigo-600 text-white ml-2';
    btn.addEventListener('click', () => input.click());

    plus.parentNode.appendChild(input);
    plus.parentNode.appendChild(btn);

    // Excel import for Passage
    if (!document.getElementById('rtg-importPassageExcelBtn')){
      const excelBtn = document.createElement('button');
      excelBtn.type = 'button';
      excelBtn.id = 'rtg-importPassageExcelBtn';
      excelBtn.innerHTML = '<i class="fas fa-file-excel mr-1"></i> Nhập Bài Khóa (EXCEL)';
      excelBtn.className = btn.className ? (btn.className + ' ml-2 bg-emerald-600 hover:bg-emerald-700') : 'px-4 py-2 rounded-xl bg-emerald-600 text-white ml-2';
      excelBtn.addEventListener('click', () => {
        const modal = document.getElementById('rtg-excel-modal');
        if (!modal){ alert('Không tìm thấy trình nhập Excel.'); return; }
        window.rtgExcelPassageMode=true;
        modal.classList.add('passage-view');
        const prev=document.getElementById('rtg-excel-preview');
        if (prev) prev.textContent='Chưa có dữ liệu xem trước.';
        modal.style.display='flex';
      });
      plus.parentNode.appendChild(excelBtn);
    }
  }

  const obs = new MutationObserver(ensure);
  obs.observe(document.body, { childList: true, subtree: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensure); else ensure();
})();
</script>

<script>
(function(){
  const S = {
    apiKey: 'rtg_ai_apiKey',
    baseUrl: 'rtg_ai_baseUrl',
    model:   'rtg_ai_model',
    sys:     'rtg_ai_system_prompt',
    history: 'rtg_ai_chat_history',
    useCtx:  'rtg_ai_use_lesson_ctx',
    priceIn: 'rtg_ai_price_in',
    priceOut:'rtg_ai_price_out',
  };
  const getLS  = (k, d='') => { try{ const v = localStorage.getItem(k); return v==null?d:v; }catch(_){ return d; } };
  const setLS  = (k, v)   => { try{ localStorage.setItem(k, v); }catch(_){} };
  const getLSBool = (k, d=true) => { const v = getLS(k, d? '1':'0'); return v==='1' || v===true || v==='true'; };
  const getLSNum  = (k, d=0)     => { const v = parseFloat(getLS(k, String(d))); return Number.isFinite(v)? v : d; };

  // Defaults for Gemini-only
  const DEFAULT_BASE = 'https://generativelanguage.googleapis.com/v1beta';
  const DEFAULT_MODEL= 'gemini-1.5-flash';
  const DEFAULT_SYS = `Bạn là trợ lý AI chuyên dạy tiếng Trung cho một người Việt Nam đang tự học.
- Ngôn ngữ trả lời mặc định: tiếng Việt (giải thích), câu và từ tiếng Trung phải kèm pinyin.
- Khi người dùng gửi MỘT CÂU tiếng Trung: trước tiên kiểm tra ngữ pháp & tự nhiên; nếu sai hãy sửa rồi mới mở rộng; nếu đúng, xác nhận "câu ok" rồi mở rộng.
- Mở rộng: luôn tạo 2 câu DÀI hơn và 2 câu NGẮN hơn từ câu đó. Dán pinyin dưới mỗi câu.
- Khi người dùng hỏi về từ vựng: đưa Hán Việt, pinyin, nghĩa tiếng Việt, bối cảnh dùng ngắn gọn; nếu phù hợp, thêm từ gần nghĩa/ trái nghĩa; có thể phân tích bộ thủ của chữ.
- Khi dịch: bám sát ngữ cảnh, tự nhiên, xưng hô hợp lý theo quan hệ.
- Ưu tiên tái sử dụng từ đã học nếu hợp lý.
- Chỉ đưa nội dung hữu ích; không nói lan man.`;

  // Lesson context
  const RTG_CUR_ID   = 'rtg_currentLessonId';
  const RTG_CUR_NAME = 'rtg_currentLessonName';
  const LESSONS_KEY  = 'chineseVocabLessons';

  function getLessonContext(maxItems = 60) {
    try {
      const curId  = JSON.parse(localStorage.getItem(RTG_CUR_ID)  || 'null');
      const curNam = JSON.parse(localStorage.getItem(RTG_CUR_NAME)|| 'null');
      const lessons = JSON.parse(localStorage.getItem(LESSONS_KEY) || '[]');
      const ls = lessons.find(l => (l && l.id) === curId) || null;
      const items = (ls?.vocabularies || []).slice(0, maxItems).map(v => {
        const han = v?.hanTu || v?.chinese || '';
        const pin = v?.pinyin || '';
        const mean= v?.meaning || '';
        return `${han} (${pin}) — ${mean}`;
      });
      if (!ls) return '';
      return `Ngữ cảnh hiện tại: Bài học “${curNam || (ls?.name||'')}” với một số từ vựng: \n` + items.join('\\n');
    } catch(_) { return ''; }
  }

  // Markdown renderer
  
function renderMarkdown(src){

    let s = String(src || '');
    s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/```([\\s\\S]*?)```/g, (m, code) => {
      const c = String(code||'').replace(/&/g,'&amp;');
      return `<pre class="rtg-code"><code>${c}</code></pre>`;
    });
    s = s.replace(/`([^`]+?)`/g, '<code>$1</code>');
    s = s.replace(/\\*\\*([^*]+?)\\*\\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\\s(])\\*([^*\\n]+?)\\*(?=[\\s).,!?:;]|$)/g, '$1<em>$2</em>');

    const lines = s.split(/\\r?\\n/);
    const out = [];
    let inUL = false, inOL = false;
    const closeLists = () => { if (inUL){ out.push('</ul>'); inUL=false;} if (inOL){ out.push('</ol>'); inOL=false;} };
    for (let line of lines){
      if (/^\\s*[-*]\\s+/.test(line)){ if (!inUL){ closeLists(); out.push('<ul>'); inUL=true; } out.push('<li>'+line.replace(/^\\s*[-*]\\s+/,'')+'</li>'); continue; }
      if (/^\\s*\\d+\\.\\s+/.test(line)){ if (!inOL){ closeLists(); out.push('<ol>'); inOL=true; } out.push('<li>'+line.replace(/^\\s*\\d+\\.\\s+/,'')+'</li>'); continue; }
      closeLists();
      if (line.trim()===''){ out.push('<br/>'); } else { out.push('<p>'+line+'</p>'); }
    }
    closeLists();
    return out.join('');
  }

  
  // Plain clean text renderer (no markdown emphasis)
  function renderPlain(src){
    let s = String(src || '');
    // Remove HTML-like tags entirely
    s = s.replace(/<[^>]+>/g, '');
    // Fix escaped artifacts strong&gt; etc
    s = s.replace(/sstrong(?:>|&gt;)/gi,'s')
         .replace(/\(\s*strong(?:>|&gt;)/gi,'(')
         .replace(/\/?\s*strong(?:>|&gt;)/gi,'')
         .replace(/(?:^|\s)strong(?:>|&gt;)/gi,'');
    // Strip markdown markers ** and * when used as emphasis
    s = s.replace(/\*\*([^*]+?)\*\*/g, '$1');
    s = s.replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s).,!?:;]|$)/g, '$1$2');
    // Convert lines to simple paragraphs
    const lines = s.split(/\r?\n/);
    const out = [];
    for (let line of lines){
      if (line.trim()==='') out.push('<br/>');
      else out.push('<p>'+line.replace(/^\s*[-*]\s+/, '')+'</p>');
    }
    return out.join('');
  }

  
  // Smart renderer: sanitize + allow **bold**/*italic* + bold Hanzi + simple lists + headings
  function renderSmart(src){
    let s = String(src || '');

    // Strip any HTML tags from model
    s = s.replace(/<[^>]+>/g, '');

    // Cleanup various 'strong' artifacts and escaped variants
    s = s.replace(/sstrong(?:>|&gt;)/gi,'s')
         .replace(/\(\s*strong(?:>|&gt;)/gi,'(')
         .replace(/\/?\s*strong(?:>|&gt;)/gi,'')
         .replace(/(?:^|\s)strong(?:>|&gt;)/gi,'');

    // Headings at line start like "Dịch:" or "Giải thích cách dùng:" -> strong
    s = s.replace(/^(Dịch|Giải thích cách dùng|Giải thích|Phân tích cấu tạo)\s*:/gmi, function(m){return '**'+m+'**'});

    // Markdown emphasis (bold/italic)
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>');

    // Lines -> handle bullet lists and paragraphs
    const lines = s.split(/\r?\n/);
    const out = [];
    let inUL = false, inOL = false;
    const closeLists = () => { if (inUL){ out.push('</ul>'); inUL=false;} if (inOL){ out.push('</ol>'); inOL=false;} };
    for (let line of lines){
      if (/^\s*[-*]\s+/.test(line)){ if (!inUL){ closeLists(); out.push('<ul>'); inUL=true; } out.push('<li>'+line.replace(/^\s*[-*]\s+/, '')+'</li>'); continue; }
      if (/^\s*\d+\.\s+/.test(line)){ if (!inOL){ closeLists(); out.push('<ol>'); inOL=true; } out.push('<li>'+line.replace(/^\s*\d+\.\s+/, '')+'</li>'); continue; }
      closeLists();
      if (line.trim()===''){ out.push('<br/>'); }
      else { out.push('<p>'+line+'</p>'); }
    }
    closeLists();

    // Bold Hanzi sequences outside of tags
    function boldCJK(htmlStr){
      const parts = htmlStr.split(/(<[^>]+>)/g);
      for (let i=0;i<parts.length;i++){
        const seg = parts[i];
        if (!seg || seg.startsWith('<')) continue;
        parts[i] = seg.replace(/([\u4E00-\u9FFF]+)/g, '<strong>$1</strong>');
      }
      return parts.join('');
    }
    return boldCJK(out.join(''));
  }

  function stripHTML(str){ return String(str||'').replace(/<[^>]+>/g, ''); }

  // Token estimator
  function roughTokensFromText(str=''){
    if (!str) return 0;
    const cjk = (str.match(/[\\u4E00-\\u9FFF]/g)||[]).length;
    const non = str.length - cjk;
    return Math.max(1, Math.round(cjk + non/4));
  }

  async function geminiCall(messages){
    const apiKey = getLS(S.apiKey, '');
    const baseTmp= getLS(S.baseUrl, DEFAULT_BASE);
    const base = (baseTmp && baseTmp.endsWith('/')) ? baseTmp.slice(0,-1) : baseTmp;
    const model = getLS(S.model, DEFAULT_MODEL);
    if (!apiKey) throw new Error('Chưa có API key. Mở ⚙️ để đặt API key.');

    const sysIndex = messages.findIndex(m => m.role === 'system');
    const sysText = sysIndex >= 0 ? (messages[sysIndex]?.content || '') : '';
    const conv = messages.filter((_,i)=> i !== sysIndex).map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }],
    }));

    const url = `${base}/models/${encodeURIComponent(model)}:generateContent`;
    const body = { contents: conv, generationConfig: { temperature: 0.2 } };
    if (sysText) body.systemInstruction = { role: 'system', parts: [{ text: sysText }] };

    const res = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json','x-goog-api-key': apiKey}, body: JSON.stringify(body) });
    const text = await res.text();
    if (!res.ok) throw new Error(`Gemini lỗi ${res.status}: ${text}`);
    const data = JSON.parse(text);
    const txt = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    const usageMeta = data?.usageMetadata || null;
    let usage = null;
    if (usageMeta){
      usage = {
        prompt_tokens: usageMeta.promptTokenCount || 0,
        completion_tokens: usageMeta.candidatesTokenCount || 0,
        total_tokens: usageMeta.totalTokenCount || ((usageMeta.promptTokenCount||0)+(usageMeta.candidatesTokenCount||0))
      };
    }
    return { text: (txt||'').trim(), usage };
  }

  function el(tag, attrs={}, html=''){
    const e = document.createElement(tag);
    for (const k in attrs){
      if (k==='class') e.className = attrs[k];
      else if (k==='style') e.style.cssText = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html) e.innerHTML = html;
    return e;
  }

  function makeEstimator(getState){
    const box = el('div', { class:'rtg-est' });
    function render(){
      const st = getState();
      const base = (getLS(S.baseUrl, DEFAULT_BASE) || DEFAULT_BASE);
      const priceIn  = getLSNum(S.priceIn, 0.0);
      const priceOut = getLSNum(S.priceOut, 0.0);
      const inTok = roughTokensFromText(st.text) + roughTokensFromText(st.sys) + roughTokensFromText(st.ctx);
      const outTok = st.expOut;
      const estCost = inTok/1e6*priceIn + outTok/1e6*priceOut;
      const tiers = [
        {label:'Rất ngắn', t:150},
        {label:'Ngắn', t:300},
        {label:'Vừa', t:600},
        {label:'Dài', t:900},

      ];
      box.innerHTML = `

          <div class="rtg-mini">Ước tính token cho lượt này (chỉ tính: system + ngữ cảnh + phần bạn nhập)</div>
          <div class="rtg-mini">Base: <span class="k">Gemini</span></div>
        </div>
        <div class="rtg-row rtg-mini" style="display:flex;align-items:center;gap:8px;margin-top:4px;">
          <span>Input ≈ <span class="k">${inTok.toLocaleString()}</span> tok</span>
